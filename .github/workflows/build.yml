name: Build WinUI 3 (PhotoRenameAIHash)



on:

  push:

    # fix2 必须显式列出：本轮所有审查修复都在 fix2 上做，漏了它 → 推送不触发任何构建，
    # 全部修复失去验证（此前正是 main/Hy/pfx/fix 四个名字写死，新分支一律不跑）。
    # fix* 是兜底：后续再拉 fix3 / fix-xxx 一类分支时不必回来改这里，也不会因为
    # 「名字没登记」而出现「推了但 CI 静默没跑」——那是最难发现的一类失败。
    branches: [main, Hy, pfx, fix, fix2, fix*]

  workflow_dispatch:



jobs:

  build:

    runs-on: windows-latest

    permissions:

      contents: write



    steps:

      - name: Checkout

        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（固定 SHA：移动标签可被上游改指向）



      - name: Setup .NET 8 SDK

        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4（固定 SHA）

        with:

          dotnet-version: '8.0.x'



      - name: Setup MSBuild (Visual Studio)

        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2（固定 SHA）



      # =====================================================================

      # A-16 版本一致性断言（阻断式，只读）。

      # 版本号靠人工在 Package.appxmanifest(<Identity Version=x.y.z.w>) 与

      # Models/AppSettings.cs(AppVersion="x.y.z") 两处同步，此前无任何断言：

      # 一旦漏改，会出现"关于页显示旧版本 / 商店清单显示新版本"的错位。

      # 位置选在 Setup MSBuild 之后、Restore 之前：只依赖两个源文件，放在最贵的

      # Restore/Publish 之前可尽早失败，避免白跑 ~10 分钟构建。

      # =====================================================================

      - name: Assert version consistency (manifest vs AppSettings) (blocking)

        shell: pwsh

        run: |

          "CHECKPOINT:version-assert-start" >> ci-diagnostics.log

          $ErrorActionPreference = 'Stop'

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "Package.appxmanifest"

          $settingsPath = Join-Path $env:GITHUB_WORKSPACE "Models/AppSettings.cs"

          if (-not (Test-Path $manifestPath)) { Write-Error "缺少 Package.appxmanifest"; exit 1 }

          if (-not (Test-Path $settingsPath)) { Write-Error "缺少 Models/AppSettings.cs"; exit 1 }

          $m = Get-Content $manifestPath -Raw

          $s = Get-Content $settingsPath -Raw

          # 只在 <Identity ...> 元素内取 Version，避免误匹配 MinVersion/MaxVersionTested

          $identity = [regex]::Match($m, '<Identity\b[^>]*>', [System.Text.RegularExpressions.RegexOptions]::Singleline).Value

          $mv = [regex]::Match($identity, 'Version="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value

          if (-not $mv) { Write-Error "Package.appxmanifest 的 <Identity> 未找到 Version=x.y.z.w"; exit 1 }

          $av = [regex]::Match($s, 'AppVersion\s*=\s*"([^"]+)"').Groups[1].Value

          if (-not $av) { Write-Error "Models/AppSettings.cs 未找到 AppVersion"; exit 1 }

          $m3 = ($mv -split '\.')[0..2] -join '.'

          $line = "VERSION manifest=" + $mv + " app=" + $av

          $line >> ci-diagnostics.log

          Write-Host $line

          if ($m3 -ne $av) { Write-Error ("版本不一致：Package.appxmanifest Version=" + $mv + "（前三段 " + $m3 + "）!= Models/AppSettings.cs AppVersion=" + $av + "。发版时需同步修改两处。"); exit 1 }

          # ------------------------------------------------------------------
          # 单调性护栏（阻断式）：上面只校验「manifest 前三段 == AppSettings」这一种
          # 【内部一致性】，完全不校验版本是否比上一次已发布的【更高】。而 MSIX 的
          # 升级语义恰恰只认单调性：同版本（或更低版本）覆盖安装一律被平台拒绝，
          # 报 0x80073CFB（包已存在）—— 用户侧表现是「装不上」，而 CI 侧全绿。
          # 基线放在仓库根 LAST_RELEASE_VERSION（纯文本四段号）。
          #
          # ⚠ 该常量【必须人工维护】：没有可查询的发布记录（走 Release 之前没有），
          #   引入外部查询只会换来一个新的失败面与额外权限。维护规则：
          #     - 发版成功后，把 LAST_RELEASE_VERSION 更新为当次发布的版本号；
          #     - 忘记更新 → 护栏滞后一轮，不会误红（可接受，下一次抬版本时被发现）；
          #     - 忘记抬版本号 → 本步红灯，报错信息直接指名 —— 这正是它存在的意义。
          #   「CI 因版本未递增而红」不是噪声，是交付前唯一能拦住 0x80073CFB 的地方。
          #
          # 文件缺失 / 内容里取不到四段号 → 一并阻断：护栏失去基线时静默通过，
          # 等于把「版本必须递增」这条不变量重新变回「靠人记得」。
          # ------------------------------------------------------------------
          $lastFile = Join-Path $env:GITHUB_WORKSPACE "LAST_RELEASE_VERSION"
          if (-not (Test-Path $lastFile)) { Write-Error ("缺少 " + $lastFile + "：版本单调性护栏没有基线。请创建该文件并写入上一次【已发布】的四段版本号（如 3.1.4.0）。"); exit 1 }
          $lastRaw = [System.IO.File]::ReadAllText($lastFile)
          $lastM = [regex]::Match($lastRaw, '[0-9]+(\.[0-9]+){3}')
          if (-not $lastM.Success) { Write-Error ($lastFile + " 内容中找不到四段版本号（实际内容：" + $lastRaw.Trim() + "）：请写入形如 3.1.4.0 的上次发布版本号。"); exit 1 }
          $last = $lastM.Value
          $mvParts = @($mv -split '\.')
          $lastParts = @($last -split '\.')
          $cmp = 0
          for ($vi = 0; $vi -lt 4; $vi++) {
            $d = [int64]$mvParts[$vi] - [int64]$lastParts[$vi]
            if ($d -ne 0) { $cmp = $d; break }
          }
          $cmpName = if ($cmp -gt 0) { "newer" } elseif ($cmp -lt 0) { "older" } else { "equal" }
          ("VERSION last_release=" + $last + " compare=" + $cmpName) >> ci-diagnostics.log
          if ($cmp -le 0) {
            Write-Error ("版本号未递增：Package.appxmanifest Version=" + $mv + " 必须严格大于 LAST_RELEASE_VERSION=" + $last + "（当前判定：" + $cmpName + "）。同版本/更低版本的 MSIX 覆盖安装必然被平台拒绝（0x80073CFB，包已存在），CI 放行即等于交付即失败。请同步抬高 Package.appxmanifest 的 Identity Version 与 Models/AppSettings.cs 的 AppVersion；发版成功后再把 LAST_RELEASE_VERSION 更新为本轮发布版本。")
            exit 1
          }

          # 把源码侧确认过的版本写进环境，供后面「包内生成的 AppxManifest.xml」断言步
          # 直接读取 —— 避免在那里再写死一份，随每次发版漂移。
          Add-Content -Path $env:GITHUB_ENV -Value ("EXPECTED_MSIX_VERSION=" + $mv)

          "CHECKPOINT:version-assert-done" >> ci-diagnostics.log



      # =====================================================================
      # 能力护栏（阻断式，只读）：manifest 的能力声明漂移，后果不是报错而是静默失败
      # （broadFileSystemAccess 默认 Off —— 路径式 WinRT 访问在用户机器上静默失败；
      #  internetClient 对 full-trust 桌面应用本来就无意义，它只约束 AppContainer）。
      # 删除动作与本护栏同批落地：只删不开护栏 = 给将来埋静默失败；
      # 只开护栏不删 = 护栏立刻误伤自己解释「为什么不用」的文档注释。
      # =====================================================================
      - name: Assert manifest capabilities (blocking)
        shell: pwsh
        run: |
          "CHECKPOINT:capability-assert-start" >> ci-diagnostics.log
          $ErrorActionPreference = 'Stop'
          $m = Get-Content (Join-Path $env:GITHUB_WORKSPACE "Package.appxmanifest") -Raw

          # 1) 已裁定删除的能力不得再出现（0 = 无命中）
          $forbidden = @('broadFileSystemAccess', 'internetClient', 'picturesLibrary')
          $fhits = @()
          foreach ($c in $forbidden) { if ($m -match ('Name="' + $c + '"')) { $fhits += $c } }

          # 2) runFullTrust 必须在；用了 rescap:Capability 就必须在 IgnorableNamespaces 里声明 rescap
          $hasRunFullTrust = ($m -match 'Name="runFullTrust"')
          $hasRescapNs     = ($m -match 'IgnorableNamespaces="[^"]*rescap')

          # 3) 摘掉 broadFileSystemAccess 后，禁止再把「路径式 WinRT 文件访问」加回来。
          #    这类 API 受该能力门控，而它默认 Off —— 用户机器上会静默失败。
          #    必须排除注释行：OrganizeService.cs 里解释「为什么不用它」的文档注释
          #    不含真实调用；不排除会让 CI 红在一段注释上，护栏从此没人信。
          $pathHits = @(Get-ChildItem -Path . -Recurse -Filter *.cs |
                        Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
                        Select-String -Pattern 'GetFolderFromPathAsync|GetFileFromPathAsync|Windows\.Storage\.Storage(Folder|File)|KnownFolders\.' |
                        Where-Object { $_.Line -notmatch '^\s*(//|///|\*)' })
          $hasPath = ($pathHits.Count -gt 0)

          # 3b) 弱信号（非阻断）：using Windows.Storage（含子命名空间）但调用点还没出现
          #     上述路径式 API 时，提示确认是否需要 broadFileSystemAccess。
          #     它不进 #3 的阻断判定，因为 FolderPicker 返回的 StorageFolder 自带 Broker 令牌、
          #     不受 bFSA 门控（Views/OrganizePage.xaml.cs 就是这么用的）——判成红灯会误伤合法用法。
          #     所以这里只发 ::warning:: 让人看见，不拦发布。
          #
          #     ⚠ 原正则 'using\s+Windows\.Storage\s*;' 要求 Windows.Storage 之后紧跟分号，
          #        而仓库实际用的是【子命名空间】：Helpers/ImageDecoder.cs 的
          #        Windows.Storage.Streams、Views/OrganizePage.xaml.cs 的
          #        Windows.Storage.Pickers —— 命中数恒为 0，这条 warning 从未发出过
          #        （真·恒绿空转：判据永远不成立，绿勾不代表检查过）。
          #        现改为允许子命名空间，并对已确认不受 bFSA 门控的两个子命名空间
          #        （Streams = IBuffer/流类型；Pickers = FolderPicker，其返回值自带令牌）
          #        设白名单过滤，其余子命名空间与裸 using Windows.Storage; 一律告警。
          #        两个计数都进 CAPGUARD 日志：usingStorage 证明扫描真的命中了文件，
          #        usingStorageWarn 才是最终告警面 —— 只记后者会重演「恒 0 看不出空转」。
          $usingWhitelist = @('Streams', 'Pickers')
          $usingHits = @(Get-ChildItem -Path . -Recurse -Filter *.cs |
                         Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
                         Select-String -Pattern 'using\s+Windows\.Storage(\.[\w.]+)?\s*;' |
                         Where-Object { $_.Line -notmatch '^\s*(//|///|\*)' })
          $usingWarn = @($usingHits | Where-Object {
            $um = [regex]::Match($_.Line, 'using\s+Windows\.Storage(?:\.([\w.]+))?\s*;')
            $usub = $um.Groups[1].Value
            -not ($usub -and ($usingWhitelist -contains $usub))
          })
          if ($usingWarn.Count -gt 0) {
            Write-Host ("::warning::检测到 using Windows.Storage 且不在白名单（Streams/Pickers）内（" +
              (($usingWarn | ForEach-Object { $_.Filename + ':' + $_.LineNumber }) -join ', ') +
              "）：若用于 GetXxxFromPathAsync 这类路径式访问，必须先恢复 broadFileSystemAccess 声明并引导用户授权（该能力默认 Off 且授权后需重启）；若只用来接 FolderPicker 的返回值则无需处理，并把对应子命名空间加入本步白名单")
          }

          $line = "CAPGUARD forbidden=" + $fhits.Count + " runFullTrust=" + $hasRunFullTrust + " rescap=" + $hasRescapNs + " pathWinRT=" + $hasPath + " pathHits=" + $pathHits.Count + " usingStorage=" + $usingHits.Count + " usingStorageWarn=" + $usingWarn.Count
          $line >> ci-diagnostics.log
          Write-Host $line

          if ($fhits.Count -gt 0) { Write-Error ("manifest 出现已裁定删除的能力声明：" + ($fhits -join ', ') + "（full-trust 桌面应用不需要它们，且 bFSA 默认 Off 只会带来静默失败）"); exit 1 }
          if (-not $hasRunFullTrust) { Write-Error "manifest 缺失 runFullTrust：WinUI 3 桌面应用是 Win32 全信任模型，没有它无法达到 mediumIL"; exit 1 }
          if (($m -match 'rescap:Capability') -and (-not $hasRescapNs)) { Write-Error "使用了 rescap:Capability，但 IgnorableNamespaces 未包含 rescap，部署时会被平台拒绝"; exit 1 }
          if ($hasPath) { Write-Error ("未声明 broadFileSystemAccess，但源码非注释行存在路径式 WinRT 文件访问：" + (($pathHits | ForEach-Object { $_.Filename + ':' + $_.LineNumber }) -join ', ') + "。该能力默认 Off，用户机器上会静默失败"); exit 1 }

          Write-Host ("CAPGUARD result: " + $fhits.Count + " / " + $hasRunFullTrust + "·" + $hasRescapNs + " / " + $hasPath + " / " + $pathHits.Count)
          "CHECKPOINT:capability-assert-done" >> ci-diagnostics.log



      # =====================================================================
      # 自包含打包不变量断言（阻断式，只读）。
      # 防的是「被当成无用代码清理掉」这一类退化：下面每一条单独看都像冗余配置，
      # 删掉之后 CI 照样能出包、照样全绿，崩的是用户机器上启动那一刻（0xc000027b
      # = STATUS_ASSERTION_FAILURE，于 Microsoft.ui.xaml.dll，无任何可读报错）。
      #   ① _RemoveFrameworkReferences：自包含必需。删掉它，MSIX 里会残留一条悬空的
      #      WindowsAppRuntime FrameworkSdkReference，与打进包的运行时并存 → 启动即崩。
      #   ② WindowsAppSDKSelfContained=true：决定了运行时是否真的打进 .msix。
      #   ③ pubxml 的 SelfContained + RuntimeIdentifier：决定 .NET 8 运行时是否打进包
      #      （只有 ② 没有 ③ 的话，没装 .NET 8 桌面运行时的机器装完也起不来）。
      #   ④ PublishTrimmed=false：WinUI 3 已知问题 microsoft-ui-xaml#9914，
      #      自包含 Release 默认开剪裁会剪掉 XAML 运行期所需类型 → 启动 0xc000027b。
      #   ⑤ manifest 不得残留 <PackageDependency>：与 ① 是同一件事的两个面，
      #      声明了框架依赖却又把运行时打进包，离线安装时依赖校验失败 0x80073CF3。
      # 位置选在最贵的 Restore/Publish 之前：只读三个文件，fail fast，几秒出结果。
      #
      # ⚠ 实现要点：必须先剥掉 XML 注释再匹配。Package.appxmanifest 的注释里
      #   写着「此处不再声明…PackageDependency」——不剥注释会把它当成真声明，
      #   断言立刻误报并把绿构建刷红（已实测：原文 -match 'PackageDependency' 为 True）。
      # =====================================================================
      - name: Assert self-contained packaging invariants (blocking)
        shell: pwsh
        run: |
          "CHECKPOINT:selfcontained-guard-start" >> ci-diagnostics.log
          $ErrorActionPreference = 'Stop'
          function Strip-XmlComments([string]$t) { [regex]::Replace($t, '<!--[\s\S]*?-->', '') }

          $csprojPath = Join-Path $env:GITHUB_WORKSPACE "PhotoRenameAIHash.csproj"
          $manPath    = Join-Path $env:GITHUB_WORKSPACE "Package.appxmanifest"
          $pubPath    = Join-Path $env:GITHUB_WORKSPACE "Properties/PublishProfiles/win10-x64.pubxml"
          foreach ($p in @($csprojPath, $manPath, $pubPath)) { if (-not (Test-Path $p)) { Write-Error ("缺少 " + $p + "：自包含打包链路不完整"); exit 1 } }

          $csproj = Strip-XmlComments ([System.IO.File]::ReadAllText($csprojPath))
          $man    = Strip-XmlComments ([System.IO.File]::ReadAllText($manPath))
          $pub    = Strip-XmlComments ([System.IO.File]::ReadAllText($pubPath))

          if (-not ($csproj -match '_RemoveFrameworkReferences')) { Write-Error "csproj 缺失 _RemoveFrameworkReferences Target：自包含 MSIX 会残留悬空的 WindowsAppRuntime framework 引用，与包内运行时并存 → 启动 0xc000027b。它看起来像'无用 Target'，删不得。"; exit 1 }
          if (-not ($csproj -match '<WindowsAppSDKSelfContained>\s*true\s*</WindowsAppSDKSelfContained>')) { Write-Error "csproj 的 WindowsAppSDKSelfContained 不为 true：Windows App SDK 运行时不会打进 .msix，离线安装会因框架未预置失败"; exit 1 }
          if (-not ($pub -match '<SelfContained>\s*true\s*</SelfContained>')) { Write-Error "pubxml 的 SelfContained 不为 true：.NET 8 运行时不会打进 .msix，与「无需任何运行时预装」的承诺不符"; exit 1 }
          if (-not ($pub -match '<RuntimeIdentifier>\s*\S+\s*</RuntimeIdentifier>')) { Write-Error "pubxml 缺少 RuntimeIdentifier：自包含发布无法确定目标 RID"; exit 1 }
          if (-not ($pub -match '<PublishTrimmed>\s*false\s*</PublishTrimmed>')) { Write-Error "pubxml 的 PublishTrimmed 不为 false：WinUI 3 自包含 Release 剪裁会剪掉 XAML 运行期所需类型 → 启动 0xc000027b（microsoft-ui-xaml#9914）"; exit 1 }
          if ($man -match '<PackageDependency') { Write-Error "Package.appxmanifest 仍声明了 <PackageDependency>：自包含模型下运行时已打进包，再声明框架依赖会让离线安装时依赖校验失败（0x80073CF3）"; exit 1 }

          "SCGUARD ok: framework-target=1 wasdkSC=1 selfContained=1 rid=1 trimmed=false pkgDependency=0" >> ci-diagnostics.log
          Write-Host "SCGUARD ok: 自包含打包五项不变量全部满足"
          "CHECKPOINT:selfcontained-guard-done" >> ci-diagnostics.log

      # =====================================================================
      # Install.bat 不变量断言（阻断式，只读）。
      # 四条都属同一类：被人"顺手简化"掉之后不会立刻报错，而是退化成
      # 【静默失败】——正是本项目最难排查的那一类故障。
      #   ① chcp 65001 必须存在且位于任何中文 echo 之前：
      #      没有它，cmd 按 936 解析 UTF-8 字节 → 用户看到满屏乱码，
      #      而脚本功能完全正常、CI 全绿。
      #   ② 管理员自检必须存在：
      #      没有它，非管理员双击会在证书导入处失败，一路走到安装才抛看不懂的错。
      #      ⚠ 第八轮修（判据集合过期型空转）：旧护栏只认 'net session' / 'fltmc'，
      #        而 Install.bat 的主判据在第七轮已换成 whoami /groups 的 High Mandatory
      #        Level SID（S-1-16-12288）。旧护栏于是对新主判据零覆盖：
      #          - 删掉新主判据 → 旧护栏仍因 'net session' 存在而恒绿；
      #          - 把已被论证为「对非提权进程也可能返回 0」的 fltmc OR 分支加回来
      #            （即回归到它本要拦的旧实现）→ 旧护栏仍把 fltmc 当作合法替代而放行。
      #        护栏因此成了它本要拦的那个回归的通行证 —— 比没有护栏更危险（虚假安全感）。
      #        现改为：SID 主判据是【必要条件】（whoami /groups 与 S-1-16-12288 必须在
      #        同一可执行行上同时出现，写在注释里不算）；fltmc 在可执行行里出现即红。
      #        'net session' 仅作为脚本内的兜底，不再作为「满足本护栏」的充分条件。
      #      ⚠ 本护栏【只校验判据字符串存在，不校验判据有效性】—— 这是它剩余且无法
      #        静态消除的局限（SID 判据本身是否真的读到令牌，只能靠这处注释 + 人工复核）。
      #   ③ Install.bat 里每个 dir /b 查找模式必须在文档里出现过：
      #      这条防的是"三处各自演化"（Install.bat / README / 安装说明.txt）。
      #      只做正向（脚本模式 → 文档），不做反向：文档里用的是
      #      PhotoRenameAIHash_<version>_x64.msix 这种带占位符的写法，
      #      反向匹配会被占位符绊倒，收益不抵误报。
      #   ④ Install.bat 换行锁定（.gitattributes 的 text eol=crlf）必须真的生效：
      #      索引侧须为 LF（规范化后形态）、工作区侧须为 CRLF。索引侧仍是 crlf
      #      说明该属性只对新内容生效、已入库 blob 未规范化（下次编辑即整文件 diff 噪音）。
      # =====================================================================
      - name: Assert Install.bat invariants (blocking)
        shell: pwsh
        run: |
          "CHECKPOINT:bat-guard-start" >> ci-diagnostics.log
          $ErrorActionPreference = 'Stop'
          $batPath = Join-Path $env:GITHUB_WORKSPACE "Install.bat"
          if (-not (Test-Path $batPath)) { Write-Error "缺少 Install.bat（交付三件套之一）"; exit 1 }
          $lines = [System.IO.File]::ReadAllLines($batPath)
          $bat = $lines -join "`n"

          # ① chcp 65001，且必须在第一条含非 ASCII 的 echo 之前
          $chcpIdx = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match 'chcp\s+65001') { $chcpIdx = $i; break } }
          if ($chcpIdx -lt 0) { Write-Error "Install.bat 缺少 'chcp 65001'：中文提示会按 936 解析 UTF-8 字节 → 用户看到乱码，而脚本功能正常、CI 全绿（静默退化）"; exit 1 }
          $firstCjk = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '\S*[一-鿿]\S*' -and $lines[$i] -notmatch '^\s*REM') { $firstCjk = $i; break } }
          if ($firstCjk -ge 0 -and $chcpIdx -gt $firstCjk) { Write-Error ("Install.bat 的 'chcp 65001'（第 " + ($chcpIdx + 1) + " 行）晚于第一条含中文的非注释行（第 " + ($firstCjk + 1) + " 行）：这一行会以 936 解码成乱码"); exit 1 }

          # ② 管理员自检（主判据为必要条件；fltmc 不得回用）
          #    先剔掉注释行：SID / fltmc 只出现在解释性注释里不算「判据存在」。
          $batCode = ($lines | Where-Object { $_ -notmatch '^\s*REM\b' -and $_ -notmatch '^\s*::' }) -join "`n"
          # 主判据：必须有一行用 whoami /groups 读出 High Mandatory Level SID（S-1-16-12288）。
          if (-not ($batCode -match 'whoami\s+/groups[^\r\n]*S-1-16-12288')) {
            Write-Error "Install.bat 缺少基于完整性级别 SID 的管理员自检（同一行上须同时有 'whoami /groups' 与 'S-1-16-12288'）：这是当前的主判据，删掉它之后非管理员双击会在第 2 步证书导入处失败，一路走到安装才抛看不懂的错。注意本判据只在【可执行行】里查找，写在 REM 注释里不算。"
            exit 1
          }
          # 反向断言：fltmc 不得再作为提权判据回用（它对非提权进程也可能返回 0，OR 下自检恒真）。
          if ($batCode -match '\bfltmc\b') {
            Write-Error "Install.bat 的可执行行里又出现了 fltmc：fltmc 无参调用在部分 Windows 上对非提权进程同样返回 0，放进 OR 逻辑会让管理员自检恒为真（自检退化成装饰），正是第七轮已移除的旧实现。请改用 whoami /groups 的 S-1-16-12288 判据。"
            exit 1
          }

          # ③ 脚本里的 dir /b 查找模式必须在文档里出现过
          $patterns = @()
          foreach ($m in [regex]::Matches($bat, "dir\s+/b(?:\s+/o:\S+)?\s+(\S+\.msix)")) { $patterns += $m.Groups[1].Value }
          $patterns = $patterns | Select-Object -Unique
          if ($patterns.Count -eq 0) { Write-Error "Install.bat 里没有解析到任何 'dir /b <模式>.msix'：查找逻辑可能被重写，本步无法判断其有效性"; exit 1 }
          $docs = @()
          foreach ($d in @("README.md", "安装说明.txt")) { $p = Join-Path $env:GITHUB_WORKSPACE $d; if (Test-Path $p) { $docs += [System.IO.File]::ReadAllText($p) } }
          if ($docs.Count -eq 0) { Write-Error "找不到 README.md / 安装说明.txt，无法校验查找模式是否同步"; exit 1 }
          $undocumented = @()
          foreach ($pat in $patterns) { if (-not (($docs -join "`n") -match [regex]::Escape($pat))) { $undocumented += $pat } }
          if ($undocumented.Count -gt 0) { Write-Error ("Install.bat 的查找模式 " + ($undocumented -join ', ') + " 在 README.md / 安装说明.txt 中均未提及：三处说明已各自演化，用户按文档判断会得出错误结论。请同步文档（README 的 Installing 章节为权威源）。"); exit 1 }

          # ④ Install.bat 换行锁定（.gitattributes 的 'Install.bat text eol=crlf'）必须有断言覆盖，
          #    否则「锁死」只是声明、靠人记得（本项目已吃过「声明 ↔ 实际不一致」的亏）。
          #    期望形态：索引侧 LF（text 属性规范化后的标准入库形态）+ 工作区侧 CRLF
          #    （cmd.exe 对 LF 下的 goto / 标签 / 括号块解析不可靠，脚本会静默失效）。
          #    索引侧仍是 crlf ⇒ .gitattributes 只对后续 checkout/commit 生效，已入库的 blob
          #    尚未规范化：下次编辑该文件并 add 时 git 会把整个文件报成改动（正是该属性想
          #    避免的 diff 噪音）。修法：git add --renormalize Install.bat 后提交。
          #    避免 native 命令 stderr + ErrorActionPreference=Stop 的版本相关差异：
          #    与本文件 Verify 步调用 signtool 同款写法，临时降为 Continue 再取退出码。
          $ErrorActionPreference = 'Continue'
          $eol = (& git -C $env:GITHUB_WORKSPACE ls-files --eol Install.bat | Out-String).Trim()
          $gitExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($gitExit -ne 0 -or -not $eol) { Write-Error ("无法读取 Install.bat 的换行属性（git ls-files --eol 失败，退出码 " + $gitExit + "）：换行锁定无断言覆盖，拒绝静默放行。输出：" + $eol); exit 1 }
          if ($eol -notmatch 'i/lf') { Write-Error ("Install.bat 索引侧换行不是 LF（实际: " + $eol + "）：.gitattributes 的 'text eol=crlf' 尚未对已入库内容生效（需执行 git add --renormalize Install.bat）。当前状态下每次编辑都会把整个文件报成 diff 噪音。"); exit 1 }
          if ($eol -notmatch 'w/crlf') { Write-Error ("Install.bat 工作区侧换行不是 CRLF（实际: " + $eol + "）：cmd.exe 对 LF 下的 goto / 标签 / 括号块解析不可靠，安装脚本会静默失效。"); exit 1 }

          ("BATGUARD chcp_line=" + ($chcpIdx + 1) + " first_cjk_line=" + ($firstCjk + 1) + " patterns=" + ($patterns -join ',') + " adminSid=1 fltmc=0 eol=" + $eol) >> ci-diagnostics.log
          Write-Host ("BATGUARD ok: chcp@" + ($chcpIdx + 1) + ", patterns=" + ($patterns -join ','))
          "CHECKPOINT:bat-guard-done" >> ci-diagnostics.log



      # =====================================================================
      # NuGet 包缓存（性能优化，最佳努力类）。
      # 实测基线（run 35435866103，全流程 ~215s）：Restore 58s 且完全没命中缓存，
      # 命中后通常降到 ~10s，一次省 ~48s（约 22%）。保留这个基线，后人才能判断
      # 缓存是否还生效 —— Restore 步会把命中情况记成 CACHE hit= 写进诊断日志。
      #
      # continue-on-error：缓存是性能优化、不是交付物，缓存服务抖动不该把发布刷红
      # （否则等于把 P1-5「诊断留档失败不得把绿构建刷红」从另一个入口又放回来）。
      # 代价是"长期不可用没人发现"，所以用 CACHE hit= 把无声降级变成可观测。
      #
      # key 用「显式路径」而不是通配：hashFiles() 在没有任何文件匹配时返回空串，
      # key 会退化成 Windows-nuget-，于是所有构建共用同一个 key、还原到过期包 ——
      # 那不是"慢"，是"错"。
      #
      # key 完备性已核实（全仓 find，排除 bin/obj/.git）：不存在
      # Directory.Packages.props / Directory.Build.props / Directory.Build.targets /
      # packages.lock.json / nuget.config，也没有任何自定义 .props / .targets ——
      # 包版本只能写在 PhotoRenameAIHash.csproj 里，依赖一变 csproj 必变、key 必变。
      # ⚠ 将来若引入 Directory.Packages.props（集中式包版本管理），包版本就从
      # csproj 搬走了，必须把它加进 hashFiles(...)，否则会踩上面那个"错"。
      # =====================================================================
      - name: Cache NuGet packages

        id: nuget-cache

        continue-on-error: true

        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（固定 SHA）

        with:

          path: ~/.nuget/packages

          key: ${{ runner.os }}-nuget-${{ hashFiles('PhotoRenameAIHash.csproj', 'Properties/PublishProfiles/win10-x64.pubxml') }}

          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore

        shell: pwsh

        run: |

          "CHECKPOINT:restore-start" >> ci-diagnostics.log

          # 缓存命中情况进诊断日志：缓存步带 continue-on-error，长期 miss 或不可用
          # 不会让 CI 变红，只能靠这行看出来（否则就是无声的性能退化）。

          ("CACHE hit=" + '${{ steps.nuget-cache.outputs.cache-hit }}') >> ci-diagnostics.log

          msbuild PhotoRenameAIHash.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false

          # ⚠ 原来这里直接落 CHECKPOINT:restore-done，从不看 msbuild 的退出码。
          #   后果是诊断日志会「说谎」：Restore 失败时 CHECKPOINT 序列照样完整，
          #   用 CHECKPOINT 定位断点的人会直接跳过 Restore 去找后面的原因。
          #   msbuild 是原生命令，pwsh 默认不会因为非零退出码终止脚本，
          #   所以必须显式判 $LASTEXITCODE —— 这是 CHECKPOINT 可信度的底线。
          if ($LASTEXITCODE -ne 0) { ("RESTORE-FAILED exit=" + $LASTEXITCODE) >> ci-diagnostics.log; exit $LASTEXITCODE }

          "CHECKPOINT:restore-done" >> ci-diagnostics.log



      - name: Restore signing certificate (if secret provided)

        shell: pwsh

        env:

          PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}

        run: |
          # 原来本步没有 $ErrorActionPreference。SIGNING_PFX_B64 内容损坏（截断/被误改/
          # 复制时带换行以外的字符）时 FromBase64String 抛的是【非终止】错误，
          # 默认 'Continue' 下会静默跳过 → pfx 没生成，而 Publish 步的判据是
          # 「secret 变量是否存在」而不是「pfx 文件是否存在」，于是继续往下跑，
          # 直到 msbuild 报一串看不懂的签名错误才红。显式 Stop 让失败停在最接近根因处。
          $ErrorActionPreference = 'Stop'
          if ($env:PFX_B64) {
            [System.IO.File]::WriteAllBytes("PhotoRenameAIHash.pfx", [System.Convert]::FromBase64String($env:PFX_B64))
            Write-Host "signing pfx restored from secret"
            if (-not (Test-Path "PhotoRenameAIHash.pfx")) { Write-Error "pfx 写入后仍不存在：签名素材恢复失败"; exit 1 }
            ("PFX bytes=" + (Get-Item "PhotoRenameAIHash.pfx").Length) >> ci-diagnostics.log
          } else {
            Write-Host "no SIGNING_PFX_B64 secret; build will be unsigned"
          }

      # =====================================================================

      # 签名证书到期预警（非阻断）：CI 从 secret 恢复 pfx，证书到期会让构建在

      # 到期日突然全红且毫无提前信号。本步把「还剩多少天」变成每次构建都可见的

      # 事实，不足 30 天用 ::warning:: 打到 GitHub 界面（注释级，不阻断构建）。

      # 签名是否真的可用，仍由 Publish / Verify 两个阻断式步骤把关。

      # =====================================================================

      - name: Warn on signing certificate expiry (non-blocking)

        shell: pwsh

        env:

          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

        run: |



          "CHECKPOINT:cert-expiry-start" >> ci-diagnostics.log



          $pfx = Join-Path $env:GITHUB_WORKSPACE "PhotoRenameAIHash.pfx"



          if (-not (Test-Path $pfx)) {



            "CERTEXP=NO_PFX" >> ci-diagnostics.log



            Write-Host "CERTEXP=NO_PFX：未恢复 pfx，跳过到期检查（签名结论由 Publish 步给出）"



            "CHECKPOINT:cert-expiry-done" >> ci-diagnostics.log



            exit 0



          }



          # 读取可能失败（例如 pfx 带密码而此处未传），同样只告警：本步不阻断构建。

          try {



            # 同 Verify / Export / Compare cer 三步：无密码读失败时回落带 PFX_PASSWORD 读。
            # 本步【非阻断】，读不到会落进 catch 只打一条 warning —— 那意味着
            # 「证书还剩多少天」这个唯一的提前预警渠道静默失明，而它本来就是要
            # 避免的「到期日突然全红且毫无提前信号」。
            $cert = $null
            try { $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pfx } catch { $expNoPwdErr = $_ }
            if ($cert -and -not $cert.Thumbprint) { $cert = $null }
            if (-not $cert) {
              if (-not $env:PFX_PASSWORD) { throw ("无密码读取 pfx 失败（" + $expNoPwdErr.Exception.Message + "）且未配置 PFX_PASSWORD") }
              $sec = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
              $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pfx, $sec
            }



            $days = [math]::Floor(($cert.NotAfter - (Get-Date)).TotalDays)



            $na = $cert.NotAfter.ToString("yyyy-MM-dd")



            $line = "CERTEXP notafter=" + $na + " days_left=" + $days + " thumb=" + $cert.Thumbprint



            $line >> ci-diagnostics.log



            Write-Host $line



            if ($days -lt 0) {



              Write-Host "::warning::签名证书已于 $na 过期（days_left=$days）：请立即轮换 SIGNING_PFX_B64 / PFX_PASSWORD 并同步仓库 PhotoRenameAIHash.cer"



            } elseif ($days -lt 30) {



              Write-Host "::warning::签名证书仅剩 $days 天到期（$na）：请尽快轮换 SIGNING_PFX_B64 / PFX_PASSWORD 并同步仓库 PhotoRenameAIHash.cer"



            }



          } catch {



            Write-Warning ("无法读取签名证书到期时间: " + $_.Exception.Message)



          }



          "CHECKPOINT:cert-expiry-done" >> ci-diagnostics.log



      - name: Publish (MSIX, x64)

        # WinUI 3 必须用 Visual Studio 的 msbuild 发布（PRI 资源编译依赖 VS 的

        # AppxPackage 任务，裸 dotnet publish 会报 ExpandPriContent 任务加载失败）。

        # 本步用 Start-Process 捕获 msbuild 真实退出码与完整输出到文件，便于失败时回推诊断。
        # 签名策略：配置了 SIGNING_PFX_B64 秘钥则启用签名（含空密码）；否则关闭签名以通过构建。

        shell: pwsh

        env:

          SIGNING_PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}

          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

        run: |

          "CHECKPOINT:publish-start" >> ci-diagnostics.log

          if (-not $env:SIGNING_PFX_B64) {
            "SIGNING=DISABLED_NO_SECRET" >> ci-diagnostics.log
            Write-Error "SIGNING_PFX_B64 未配置：禁止产出未签名 MSIX（未签名包 Add-AppxPackage 报 0x800B0100，用户无法安装）"
            exit 1
          }
          # 原来只判「secret 变量是否存在」，不判「pfx 文件是否真的落盘」——
          # 两者不是一回事：secret 存在而 Restore 步写盘失败时（见上一步新增的 Stop），
          # 这里照样放行，直到 msbuild 抛一串 MSB/APPX 签名错误才红，
          # 而根因在几十行之前。多判一次文件，把失败钉在真正断点上。
          if (-not (Test-Path "PhotoRenameAIHash.pfx")) {
            "SIGNING=DISABLED_NO_PFX_FILE" >> ci-diagnostics.log
            Write-Error "SIGNING_PFX_B64 已配置，但工作区里没有 PhotoRenameAIHash.pfx（Restore signing certificate 步未成功落盘）：继续只会让 msbuild 报一串看不懂的签名错误"
            exit 1
          }
          ("SIGNING pfx_bytes=" + (Get-Item "PhotoRenameAIHash.pfx").Length) >> ci-diagnostics.log
          # P1-9 修复：MSIX 签名时间戳属性名为 AppxPackageSigningTimestampServerUrl（原写成
          # AppxPackageSigningTimestampServer 属无效属性，静默不生效）。注意：WASDK 1.5 的
          # 构建目标即使属性名正确也可能忽略时间戳（上游 bug，1.6 修复），故下方另有
          # signtool 补时间戳重签步骤兜底。
          $sign = '/p:AppxPackageSigningEnabled=true /p:AppxPackageSigningTimestampServerUrl=http://timestamp.sectigo.com /p:AppxPackageSigningTimestampDigestAlgorithm=SHA256'
          if ($env:PFX_PASSWORD) { $sign += ' /p:PackageCertificatePassword="' + $env:PFX_PASSWORD + '"' }
          "SIGNING=enabled(timestamp=sectigo,sha256)" >> ci-diagnostics.log
          Write-Host "signing args: /p:AppxPackageSigningEnabled=true /p:PackageCertificatePassword=***"

          try {

            $psi = New-Object System.Diagnostics.ProcessStartInfo

            $psi.FileName = "msbuild"

            $psi.Arguments = "PhotoRenameAIHash.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:PublishProfile=Properties\PublishProfiles\win10-x64.pubxml /p:PublishTrimmed=false $sign"

            $psi.RedirectStandardOutput = $true

            $psi.RedirectStandardError = $true

            $psi.UseShellExecute = $false

            $p = New-Object System.Diagnostics.Process

            $p.StartInfo = $psi

            $p.Start() | Out-Null

            $stdout = $p.StandardOutput.ReadToEnd()

            $stderr = $p.StandardError.ReadToEnd()

            $p.WaitForExit()

            $stdout | Out-File -FilePath publish.out.log -Encoding utf8

            $stderr | Out-File -FilePath publish.err.log -Encoding utf8

            if ($p.ExitCode -ne 0) { throw "msbuild exited with $($p.ExitCode)" }

            "CHECKPOINT:publish-done" >> ci-diagnostics.log

          } catch {

            "PUBLISH-ERROR: $($_.Exception.Message)" >> ci-diagnostics.log

            exit 1

          }



      # =====================================================================

      # 关键修复：修正 exe 内嵌 manifest 中非法 processorArchitecture

      # WinAppSDK 1.5 在注入 Microsoft.WindowsAppSDK 依赖时，会把构建平台 "x64"

      # 直接写进 <dependentAssembly><assemblyIdentity processorArchitecture="x64">，

      # 而 "x64" 不是 SxS activation context 的合法枚举(必须是 "amd64")，导致双击 exe

      # 直接报"并行配置不正确"。本步用 UpdateResource 把 x64 改写为 amd64，根因级修复。

      # （此 bug 由 WinAppSDK 构建期任务生成，nupkg 中无可覆盖属性，只能修产物。）

      # 本步为必需步：改写后回读校验，确保 0 处残留 x64。

      # ---------------------------------------------------------------------

      # ⚠️ 范围警告（B-01 / A-01）：本步只作用于 bin 下的 loose exe 输出。MSIX 模式下

      #    Publish 在同一次 msbuild 进程内直接产出 .msix，loose 输出【不入 artifact】，

      #    也就是说本步的改写从未作用于用户实际拿到的 .msix。包内 exe 的合规性由紧随

      #    其后的 "Assert embedded manifest inside MSIX (blocking)" 只读断言步核验。

      # ⚠️ 严禁把本步的 <dpiAwareness> / <longPathAware> 删除正则套用到 .msix 内的 exe：

      #    app.manifest 里合法的 PerMonitorV2 声明会被 <dpiAwareness[^>]*>.*?</dpiAwareness>

      #    一并删掉，直接改包会立刻引入 P7 DPI 回归（125%+ 缩放整窗位图拉伸、文字发虚）。

      # =====================================================================

      - name: Fix embedded manifest (processorArchitecture x64 -> amd64)

        shell: pwsh

        continue-on-error: true

        run: |

          "CHECKPOINT:manifestfix-start" >> ci-diagnostics.log

          $ErrorActionPreference = 'Stop'

          $exes = Get-ChildItem -Path "bin" -Recurse -Filter "PhotoRenameAIHash.exe"

          if ($exes.Count -eq 0) { Write-Host "MSIX 模式下 Publish 直接产出 .msix，无独立 exe 需改 manifest，跳过"; "CHECKPOINT:manifestfix-skip" >> ci-diagnostics.log; exit 0 }



          # C# P/Invoke 类放在独立文件（.github/scripts/ResEdit.cs），

          # 避免内联 here-string 与 YAML run:| 缩进冲突（PowerShell 要求 "@ 必须顶格，

          # 而 YAML 要求块内每行缩进，二者不可兼得 -> 曾导致 "Invalid workflow file"）。

          $resCs = Join-Path $env:GITHUB_WORKSPACE ".github/scripts/ResEdit.cs"

          if (-not (Test-Path $resCs)) { Write-Error "缺少 $resCs（请确认已提交该文件）"; exit 1 }

          Add-Type -Path $resCs



          $enc = [System.Text.Encoding]::UTF8

          foreach ($exe in $exes) {

            $exePath = $exe.FullName

            Write-Host "==> 修补内嵌 manifest: $exePath"

            $bytes = [System.IO.File]::ReadAllBytes($exePath)

            $s = $enc.GetString($bytes)

            $start = $s.IndexOf("<assembly")

            if ($start -lt 0) { Write-Error "exe 内未找到 <assembly"; exit 1 }

            $end = $s.IndexOf("</assembly>", $start)

            if ($end -lt 0) { Write-Error "exe 内未找到 </assembly>"; exit 1 }

            $end += "</assembly>".Length

            $manifest = $s.Substring($start, $end - $start)

            $cnt = ([regex]::Matches($manifest, 'processorArchitecture="x64"')).Count

            Write-Host "    修补前 processorArchitecture=""x64"" 出现次数: $cnt"

            if ($cnt -eq 0) {

              Write-Host "    无 processorArchitecture=""x64""，无需修补(已是 amd64 或不含 x64)"

              continue

            }

            $newManifest = $manifest.Replace('processorArchitecture="x64"', 'processorArchitecture="amd64"')

            # WinAppSDK 1.5 注入的 <dpiAwareness> 元素在部分 Windows 版本报

            # "The setting ...dpiAwareness is not registered" -> Activation Context generation

            # failed -> SxS。移除该元素（DPI 由 WinUI 内部处理，删掉不影响启动）。

            $newManifest = [regex]::Replace($newManifest, '<dpiAwareness[^>]*>.*?</dpiAwareness>', '', [System.Text.RegularExpressions.RegexOptions]::Singleline)

            # WinAppSDK 1.5 注入的 <longPathAware> 元素在部分 Windows 版本同样报

            # "The setting ...WindowsSettings^longPathAware is not registered" -> Activation

            # Context generation failed -> SxS。移除该元素（长路径由 OS/WinUI 内部处理，删不影响启动）。

            $newManifest = [regex]::Replace($newManifest, '<longPathAware[^>]*>.*?</longPathAware>', '', [System.Text.RegularExpressions.RegexOptions]::Singleline)

            $newBytes = $enc.GetBytes($newManifest)

            $h = [ResEdit]::BeginUpdateResource($exePath, $false)

            if ($h -eq [IntPtr]::Zero) { Write-Error ("BeginUpdateResource 失败: " + [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()); exit 1 }

            $ok = [ResEdit]::UpdateResource($h, [IntPtr]24, [IntPtr]1, 0, $newBytes, [uint32]$newBytes.Length)

            if (-not $ok) { Write-Error ("UpdateResource 失败: " + [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()); exit 1 }

            $ok = [ResEdit]::EndUpdateResource($h, $false)

            if (-not $ok) { Write-Error ("EndUpdateResource 失败: " + [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()); exit 1 }

            # 回读校验

            $b2 = [System.IO.File]::ReadAllBytes($exePath)

            $s2 = $enc.GetString($b2)

            $after = ([regex]::Matches($s2, 'processorArchitecture="x64"')).Count

            $afterDpi = ([regex]::Matches($s2, 'dpiAwareness')).Count

            $afterLpa = ([regex]::Matches($s2, 'longPathAware')).Count

            Write-Host ("    修补后 processorArchitecture=""x64"" 次数: " + $after + " (应为 0); dpiAwareness 残留: " + $afterDpi + " (应为 0); longPathAware 残留: " + $afterLpa + " (应为 0)")

            if ($after -ne 0 -or $afterDpi -ne 0 -or $afterLpa -ne 0) { Write-Error "修补验证失败，仍存在 x64 / dpiAwareness / longPathAware"; exit 1 }

            Write-Host "    OK: 已改写为 amd64"

          }

          "CHECKPOINT:manifestfix-done" >> ci-diagnostics.log



      # =====================================================================

      # B-01 断言（阻断式，只读）：核验【用户实际拿到的 .msix】内 exe 的内嵌 manifest。

      # 上面 "Fix embedded manifest" 步只改 bin 下的 loose exe，而 MSIX 模式下 Publish

      # 直接产出 .msix、loose 输出不入 artifact —— 此前 CI 从未真正校验过包内 exe。

      # 本步把「包内 exe 的内嵌 manifest 是否合规」变成可验证事实：若包内出现

      # processorArchitecture="x64"，用户双击 exe 会报"并行配置不正确"，必须阻断。

      # dpiAwareness / longPathAware 仅记录计数（不判定），用于判断 P7 相关声明存在性。

      # ⚠️ 本步【只读】：不解压、不重打包、不修改 .msix。

      # ⚠️ 严禁在此处或任何地方新增"直接修改 .msix 内 exe 的 manifest"逻辑：

      #    上面的 <dpiAwareness[^>]*>.*?</dpiAwareness> 删除正则会把 app.manifest 里

      #    合法的 PerMonitorV2 声明一并删掉，直接改包会引入 P7 DPI 回归

      #    （125%+ 缩放整窗位图拉伸、文字发虚）。

      # =====================================================================

      - name: Assert embedded manifest inside MSIX (blocking)

        shell: pwsh

        run: |

          "CHECKPOINT:msix-manifest-assert-start" >> ci-diagnostics.log

          $ErrorActionPreference = 'Stop'

          $msix = Get-ChildItem -Path "bin" -Recurse -Filter "*.msix" | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $msix) { "MSIXMANIFEST=NO_MSIX" >> ci-diagnostics.log; Write-Error "未找到 .msix（无法校验包内 exe 的内嵌 manifest）"; exit 1 }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)

          $entry = $zip.Entries | Where-Object { $_.Name -eq 'PhotoRenameAIHash.exe' } | Select-Object -First 1

          if (-not $entry) { $zip.Dispose(); "MSIXMANIFEST=NO_EXE_ENTRY" >> ci-diagnostics.log; Write-Error ("MSIX 内未找到 PhotoRenameAIHash.exe 条目，断言无意义（包: " + $msix.Name + ")"); exit 1 }

          $entryName = $entry.FullName

          # 只读该条目字节到内存，不解压到磁盘（避免污染工作区）

          $ms = New-Object System.IO.MemoryStream

          $st = $entry.Open()

          $st.CopyTo($ms)

          $st.Dispose()

          $bytes = $ms.ToArray()

          $ms.Dispose()

          $zip.Dispose()

          $s = [System.Text.Encoding]::UTF8.GetString($bytes)

          # ⚠ 恒绿断言的实证（第五轮观察项 1 —— 已用真实产物验证，不是推断）：
          #   本步原本只统计 'processorArchitecture="x64"' 出现次数并断言 ==0。
          #   实测 artifact-3.1.2/PhotoRenameAIHash_3.1.2.0_x64.msix 内的
          #   PhotoRenameAIHash.exe（270,848 字节，UTF-8 / UTF-16LE 两种解码直搜）：
          #       processorArchitecture = 0 次
          #       <assembly>=1  trustInfo=2  requestedExecutionLevel=2
          #       dpiAwareness=2  PerMonitorV2=1  longPathAware=0
          #   → 该 exe 的内嵌 manifest 里【根本没有 assemblyIdentity 块】，
          #     也就根本没有 processorArchitecture 属性。
          #   所以历史日志里的 "x64=0" 从来不是「已确认为 amd64」，而是
          #   「这个字符串压根不存在」——断言是空转的，恒绿等于没有断言。
          #   改成两级：
          #     ① 先证明"确实读到了一个 Win32 manifest"（manifest 标记 > 0），
          #        证明不了就阻断 —— 否则等于对着一段非 manifest 字节做统计还宣布通过；
          #     ② 只有在【真的出现 processorArchitecture】时才校验其取值不是 x64。
          #        pa_total=0 是本项目的正常形态（无 SxS assemblyIdentity），不告警；
          #        一旦上游注入了 processorArchitecture="x64"，pa_total 立刻 >0 且本步阻断，
          #        原有的 P1 防护能力完整保留且第一次真正具备触发可能。
          $paTotal = ([regex]::Matches($s, 'processorArchitecture\s*=\s*"[^"]*"')).Count

          $x64 = ([regex]::Matches($s, 'processorArchitecture="x64"')).Count

          $amd = ([regex]::Matches($s, 'processorArchitecture="amd64"')).Count

          $dpi = ([regex]::Matches($s, 'dpiAwareness')).Count

          $lpa = ([regex]::Matches($s, 'longPathAware')).Count

          $markers = ([regex]::Matches($s, '<\s*assembly[\s>]')).Count + ([regex]::Matches($s, 'trustInfo')).Count + ([regex]::Matches($s, 'requestedExecutionLevel')).Count

          $scanEffective = ($markers -gt 0)

          $line = "MSIXMANIFEST exe=" + $entryName + " x64=" + $x64 + " amd64=" + $amd + " pa_total=" + $paTotal + " manifest_markers=" + $markers + " scan_effective=" + $scanEffective + " dpiAwareness=" + $dpi + " longPathAware=" + $lpa

          $line >> ci-diagnostics.log

          Write-Host $line

          if (-not $scanEffective) { Write-Error ("包内 exe 里读不到任何 Win32 manifest 标记（<\s*assembly / trustInfo / requestedExecutionLevel 全为 0，MSIX: " + $msix.Name + "）：本次扫描无效，'x64=0' 不能作为通过依据。请核对条目选择、解压与解码是否与真实 manifest 编码一致。"); exit 1 }

          if ($x64 -ne 0) { Write-Error ("包内 exe 内嵌 manifest 仍含 processorArchitecture=""x64"" x" + $x64 + "（MSIX: " + $msix.Name + "）：SxS activation context 非法枚举，用户双击 exe 会报""并行配置不正确""。注意现有修补步改的是 loose 文件、不作用于包内，需在打包链路层面修复。"); exit 1 }

          "CHECKPOINT:msix-manifest-assert-done" >> ci-diagnostics.log



      # =====================================================================

      # 可移植增强（最佳努力，不阻断构建）：补 _APP CRT 转发器 + 常规 VC++ CRT
      #
      # ⚠ 本步【不影响交付物】，仅作用于 bin 下的 loose exe 输出目录：MSIX 在 Publish
      #    的同一次 msbuild 进程内已封包完成，这里复制的 DLL 永远进不了 .msix；而
      #    staging 步只拷 .msix / .cer / Install.bat / 安装说明.txt 四件。包内转发器
      #    由 csproj 的 Microsoft.VCRTForwarders.140 PackageReference 保证。
      #    第七轮审查（P2-3）据此判定本步对交付物零影响、建议删除；本轮【保留】，
      #    理由：① 唯一收益是少几十秒构建与少一段日志，而删除要改动 110 行 YAML，
      #    本机跑不了 CI，收益不抵风险；② 它带 continue-on-error，永远不会把构建刷红；
      #    ③ 若将来改用非 MSIX 的 loose 产物分发，本步会重新变成必需。
      #    保留的同时把「它不进包」写明，避免排障者把日志里的 [OK]/[缺失] 误读成
      #    交付物状态（这与 P2-12 是同一类误读）。

      # WinAppSDK 原生 DLL 按 _APP 后缀 CRT 链接；Microsoft.VCRTForwarders.140 提供

      # 转发器把 _APP 名称重定向到系统常规 vcruntime140.dll。再把常规 VC++ 140 家族

      # 一并拷入，使制品在目标机未装 VC++ 可再发行时也能直接运行。

      # 注意：SxS 的真正的根因已在上面 manifest 步修复；本步仅为可移植性增强。

      # 即便 nuget/System32 临时不可用，开发者本机装有 VC++/WinAppSDK 运行时仍可运行，

      # 因此本步失败不阻断 CI（continue-on-error）。

      # =====================================================================

      - name: Bundle _APP CRT forwarders + portable VC++ CRT (best-effort)

        shell: pwsh

        continue-on-error: true

        run: |

          "CHECKPOINT:forwarders-start" >> ci-diagnostics.log

          $ErrorActionPreference = 'Continue'

          $exes = Get-ChildItem -Path "bin" -Recurse -Filter "PhotoRenameAIHash.exe"

          if ($exes.Count -eq 0) { Write-Warning "未找到 exe，跳过 forwarder 复制"; exit 0 }

          $dirs = $exes | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique



          # 1) 自 nuget.org 拉取 Microsoft.VCRTForwarders.140 并解压 forwarders（重试 3 次）

          $ver = "1.1.0"

          $ok = $false

          for ($i = 1; $i -le 3; $i++) {

            try {

              $nupkg = Join-Path $env:RUNNER_TEMP ("vcrtf." + $ver + ".nupkg")

              Write-Host "下载 Microsoft.VCRTForwarders.140 $ver (第 $i 次) ..."

              Invoke-WebRequest -Uri ("https://api.nuget.org/v3-flatcontainer/microsoft.vcrtforwarders.140/" + $ver + "/microsoft.vcrtforwarders.140." + $ver + ".nupkg") -OutFile $nupkg -ErrorAction Stop

              # 解压 nupkg（Expand-Archive 是 PowerShell 原生 cmdlet，无需反射 ZipFile）

              $extractDir = Join-Path $env:RUNNER_TEMP ("vcrtf_extract_" + $i)

              if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }

              Expand-Archive -Path $nupkg -DestinationPath $extractDir -Force

              $rel = Join-Path $extractDir "runtimes/win-x64/native/release"

              if (-not (Test-Path $rel)) { throw "nupkg 内未找到 runtimes/win-x64/native/release" }

              $fw = 0

              Get-ChildItem -Path $rel -Filter "*.dll" | ForEach-Object {

                foreach ($d in $dirs) { Copy-Item $_.FullName -Destination $d -Force }

                $fw++

              }

              Write-Host "已解压 $fw 个 forwarder DLL 到 $($dirs.Count) 个输出目录"

              $ok = $true

              break

            } catch {

              Write-Warning ("nuget 下载/解压第 $i 次失败: " + $_.Exception.Message)

            }

          }

          if (-not $ok) { Write-Warning "无法从 nuget 获取 forwarders（本机有 VC++/WinAppSDK 运行时仍可运行）" }



          # 2) 常规 VC++ 140 家族(转发器最终依赖的对象)，从 runner System32 复制（最佳努力）

          $sysCrtPrefixes = @("vcruntime140","msvcp140","concrt140","vccorlib140","vcomp140","vcamp140")

          foreach ($d in $dirs) {

            foreach ($p in $sysCrtPrefixes) {

              Get-ChildItem -Path (Join-Path $env:SystemRoot "System32") -Filter ($p + "*.dll") -ErrorAction SilentlyContinue | ForEach-Object {

                Copy-Item $_.FullName -Destination $d -Force -ErrorAction SilentlyContinue

              }

            }

          }



          # 3) 诊断：列出输出目录的 _app DLL 是否就位

          $appDlls = @("vcruntime140_app.dll","msvcp140_app.dll","concrt140_app.dll","vcruntime140_1_app.dll","msvcp140_1_app.dll","msvcp140_2_app.dll","msvcp140_atomic_wait_app.dll","vccorlib140_app.dll","vcomp140_app.dll","vcamp140_app.dll")

          foreach ($d in $dirs) {

            Write-Host "输出目录 $d 的 _app DLL 状态:"

            foreach ($dl in $appDlls) {

              if (Test-Path (Join-Path $d $dl)) { Write-Host ("  [OK]   " + $dl) } else { Write-Warning ("  [缺失] " + $dl) }

            }

          }

          "CHECKPOINT:forwarders-done" >> ci-diagnostics.log



      # === 诊断：确认 exe 与 manifest 状态（无论后面是否红，日志里一眼可见） ===

      - name: Diagnostics before upload

        shell: pwsh

        run: |

          "CHECKPOINT:diagnostics-start" >> ci-diagnostics.log

          $ErrorActionPreference = 'Continue'

          $exes = Get-ChildItem -Path "bin" -Recurse -Filter "PhotoRenameAIHash.exe"

          if ($exes.Count -eq 0) { Write-Warning "诊断: 未找到 exe（Publish 可能失败）"; exit 0 }

          foreach ($exe in $exes) {

            $d = $exe.DirectoryName

            Write-Host "EXE: $($exe.FullName)"

            $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)

            $s = [System.Text.Encoding]::UTF8.GetString($bytes)

            $x64 = ([regex]::Matches($s, 'processorArchitecture="x64"')).Count

            $amd = ([regex]::Matches($s, 'processorArchitecture="amd64"')).Count

            Write-Host ("  manifest processorArchitecture: x64=$x64 amd64=$amd (期望 x64=0)")

            $sz = (Get-ChildItem $d -Recurse -File | Measure-Object -Property Length -Sum).Sum

            Write-Host ("  dir size: {0:N0} bytes, files: {1}" -f $sz, (Get-ChildItem $d -Recurse -File).Count)

          }

          "CHECKPOINT:diagnostics-done" >> ci-diagnostics.log



      # === 打包为单个 zip 再上传（避免 upload-artifact 直传大目录树的尺寸/长路径问题） ===

      # 签名校验（阻断式）：MSIX 只有签名成功才会写入 AppxSignature.p7x 条目，
      # 以此为结构性判据；signtool verify /pa 复核前，先把签名 pfx 导出的证书
      # 导入本机 TrustedPeople —— 与用户侧 Install.bat 的信任动作完全一致，不导入 Root。
      # 自签名证书在 runner 上默认不受信任，不先信任必然误报 0x800B0109。
      # 已由真实 CI 运行证实 TrustedPeople 单独即可通过 signtool verify /pa：
      #   run 35432681789（72377da）-> VERIFY truststore=TrustedPeople / VERIFY signtool=PASS
      # 因此不再保留 Root 回落分支：回落会让 CI 走一条用户机器上不存在的信任链，
      # 出现「Root 能过、用户 TrustedPeople-only 装不上」的假绿灯。
      # =====================================================================
      # P1-9 兜底：WASDK 1.5 的 SignAppxPackage 构建目标即使传入正确的
      # AppxPackageSigningTimestampServerUrl 也可能忽略时间戳（上游已知问题，
      # 1.6 才修复）。无时间戳的签名在证书过期后会被 Windows 拒绝安装。
      # 此步用 Windows SDK 的 signtool 对 MSIX 做带 RFC3161 时间戳的重签
      # （重签即替换既有签名），失败自动重试并切换备用时间戳服务器，阻断式。
      # =====================================================================
      - name: Re-sign MSIX with RFC3161 timestamp (signtool)
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          "CHECKPOINT:timestamp-resign-start" >> ci-diagnostics.log
          $ErrorActionPreference = 'Stop'
          # 对 bin 下发现的全部 .msix 重签（防 AppPackages 目录中同时存在多架构/多变体包时漏签）
          $msixes = @(Get-ChildItem -Path "bin" -Recurse -Filter "*.msix" | Sort-Object LastWriteTime -Descending)
          if ($msixes.Count -eq 0) { "RESIGN=NO_MSIX" >> ci-diagnostics.log; Write-Error "未找到 .msix"; exit 1 }

          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $st) { Write-Error "未找到 signtool.exe"; exit 1 }

          $pwdArgs = @()
          if ($env:PFX_PASSWORD) { $pwdArgs = @('/p', $env:PFX_PASSWORD) }

          $servers = @('http://timestamp.sectigo.com', 'http://timestamp.digicert.com')
          foreach ($msix in $msixes) {
            $signed = $false
            foreach ($ts in $servers) {
              for ($i = 1; $i -le 3; $i++) {
                & $st.FullName sign /f PhotoRenameAIHash.pfx @pwdArgs /fd SHA256 /tr $ts /td SHA256 $msix.FullName | Tee-Object -Variable out | Out-Host
                if ($LASTEXITCODE -eq 0) { Write-Host "时间戳重签成功: $($msix.Name) (server=$ts, attempt=$i)"; $signed = $true; break }
                Write-Warning "重签失败 ($($msix.Name), server=$ts, attempt=$i, exit=$LASTEXITCODE)，稍后重试"
                Start-Sleep -Seconds 5
              }
              if ($signed) { break }
            }
            ("RESIGN " + $msix.Name + " ok=" + $signed) >> ci-diagnostics.log
            if (-not $signed) { Write-Error "时间戳重签失败：$($msix.Name) 所有时间戳服务器均不可达或签名被拒"; exit 1 }
          }
          "CHECKPOINT:timestamp-resign-done" >> ci-diagnostics.log

      - name: Verify MSIX signature (blocking)
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          "CHECKPOINT:verify-start" >> ci-diagnostics.log
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem -Path "bin" -Recurse -Filter "*.msix" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { "VERIFY=NO_MSIX" >> ci-diagnostics.log; Write-Error "未找到 .msix"; exit 1 }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $p7x = $zip.Entries | Where-Object { $_.FullName -eq 'AppxSignature.p7x' }
          $zip.Dispose()
          ("VERIFY structural p7x=" + [bool]$p7x) >> ci-diagnostics.log
          if (-not $p7x) { Write-Error "MSIX 内无 AppxSignature.p7x -> 未签名"; exit 1 }

          # 从签名源 pfx 取证书（唯一事实来源），先信任再验证。
          # ⚠ 密码对称性：Publish 与 Re-sign 两步都【带 PFX_PASSWORD】读同一个 pfx，
          #   而本步原本用无参构造函数读它。当前 pfx 恰好是空密码所以一直没暴露——
          #   一旦轮换成带密码的 pfx，本步会以 CryptographicException 报红，
          #   而报错信息里完全看不出「是密码问题」。故先按无密码读，失败再用密码读。
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "PhotoRenameAIHash.pfx"
          $cert = $null
          try { $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pfxPath } catch { $noPwdErr = $_ }
          if ($cert -and -not $cert.Thumbprint) { $cert = $null }
          if (-not $cert -and $env:PFX_PASSWORD) {
            $sec = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pfxPath, $sec
          }
          if (-not $cert) { Write-Error ("无法从 pfx 读取签名证书（无密码读失败：" + $noPwdErr.Exception.Message + "；PFX_PASSWORD " + $(if ($env:PFX_PASSWORD) { "已配置但带密码读取仍失败" } else { "未配置" }) + "）"); exit 1 }
          ("VERIFY signer_thumbprint=" + $cert.Thumbprint) >> ci-diagnostics.log

          # ① 签名证书 Subject ↔ manifest Identity Publisher 比对（阻断式）。
          #    signtool verify /pa 只证明「签名有效且能在本机建链」，【完全不看】签名
          #    发布者与清单发布者是否一致。两者不一致时：签名有效、verify 通过、
          #    产物齐全、CI 全绿，而用户 Add-AppxPackage 被平台以发布者不匹配拒绝
          #    （0x800B0109）；Install.bat 的错误码表还会把该码导向「证书未受信任」，
          #    排障方向被带偏。这是典型的「CI 绿灯 ≠ 用户装得上」。
          #    比对取双方的 CN= 段而非整串相等：X.509 Subject 常带 O= / C= 等后缀
          #    （"CN=PhotoRenameAIHash, O=..."），整串比对会在证书合法轮换时误红。
          $mRaw = Get-Content (Join-Path $env:GITHUB_WORKSPACE "Package.appxmanifest") -Raw
          $pub  = [regex]::Match($mRaw, '<Identity\b[^>]*\bPublisher="([^"]+)"').Groups[1].Value
          function Get-CnValue([string]$s) {
            $mm = [regex]::Match($s, 'CN\s*=\s*([^,]+)')
            if ($mm.Success) { return $mm.Groups[1].Value.Trim() }
            return $s.Trim()
          }
          $pubCn = Get-CnValue $pub
          $subCn = Get-CnValue $cert.Subject
          ("VERIFY publisher_cn=" + $pubCn + " signer_cn=" + $subCn) >> ci-diagnostics.log
          if (-not $pubCn -or -not $subCn -or ($pubCn -ne $subCn)) {
            Write-Error ("签名证书 Subject（CN=" + $subCn + "）与 Package.appxmanifest 的 Identity Publisher（CN=" + $pubCn + "）不匹配：MSIX 安装时会被平台以发布者不一致拒绝（0x800B0109），而 signtool verify 不会发现。请轮换证书使其 Subject 与 Publisher 一致，或同步修改 Publisher —— 改 Publisher 意味着必须重新签发证书，并更新仓库内 PhotoRenameAIHash.cer。")
            exit 1
          }
          # ②（P1）最小信任原则：只导入 TrustedPeople —— MSIX 旁加载的信任链只需要它。
          # 自签名证书本身无 CA 基本约束，放进 Root 等价于宣布「该私钥签的任何东西都被本机
          # 信任」，是机器级的安全放大；能不导入就不导入。（用户侧 Install.bat 同样只导入
          # TrustedPeople；CI 一旦改走别的信任链，绿灯就不能代表用户能装上。）
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPeople", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          Write-Host ("cert trusted on runner (TrustedPeople): " + $cert.Thumbprint)

          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $verified = $false
          $trustStore = "none"
          if ($st) {
            $ErrorActionPreference = 'Continue'
            & $st.FullName verify /pa $msix.FullName | Tee-Object -Variable vt | Out-Host
            ("VERIFY signtool_output: " + ($vt -join ' | ')) >> ci-diagnostics.log
            $ErrorActionPreference = 'Stop'
            if ($LASTEXITCODE -eq 0) { $verified = $true; $trustStore = "TrustedPeople" }
          } else {
            # 原实现是 Write-Warning + 跳过：此时 $st 为 $null，下面两个阻断分支的条件
            # 都不成立 → 步骤退出 0、界面显示绿勾，而实际只做了「p7x 条目存在」这一项
            # 结构性检查（p7x 存在 ≠ 签名有效）。名为 (blocking) 的步骤存在退出 0 的
            # 软失败出口，全靠前一阻断步 Re-sign 在 signtool 缺失时先 exit 1 兜底 ——
            # 那是靠邻居救场，一旦 Re-sign 被重构或加了 continue-on-error，这里立刻
            # 变成真实的静默失败。改为硬失败：签名校验不可被降级。
            Write-Error "未找到 signtool.exe：无法完成签名校验（结构性 p7x 条目存在 ≠ 签名有效），签名链路不得降级放行"
            exit 1
          }

          # 不再有 Root 回落（证据见步首注释：真实运行 VERIFY truststore=TrustedPeople）。
          # 若将来 runner 变化导致 TrustedPeople 不足以通过，本步直接 exit 1 报红，
          # 而不是换一条用户机器上不存在的信任链把自己救绿 —— 假绿灯比红灯更贵。
          ("VERIFY truststore=" + $trustStore) >> ci-diagnostics.log

          # 去掉 `-and $st`：signtool 缺失已在上一个 else 分支 exit 1，此处无条件判定
          # 才能真正做到「不通过就红」，而不是依赖某个变量恰好非空。
          if (-not $verified) { Write-Error "signtool verify 失败：包签名无效，或 TrustedPeople 不足以建立信任链（无 Root 回落）"; exit 1 }
          "VERIFY signtool=PASS" >> ci-diagnostics.log
          "CHECKPOINT:verify-done" >> ci-diagnostics.log

      # =====================================================================
      # P0-4 校验（阻断式）：确认 MSIX 内已含 .NET 运行时（pubxml SelfContained=true 生效）。
      # 若缺失则发布链路已退回"框架依赖"而无人察觉——未装 .NET 8 的机器安装后将无法启动。
      # =====================================================================
      - name: Verify self-contained .NET runtime in MSIX (blocking)
        shell: pwsh
        run: |
          "CHECKPOINT:selfcontained-verify-start" >> ci-diagnostics.log
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem -Path "bin" -Recurse -Filter "*.msix" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { "SCVERIFY=NO_MSIX" >> ci-diagnostics.log; Write-Error "未找到 .msix"; exit 1 }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $names = $zip.Entries.FullName
          $zip.Dispose()
          $required = @('coreclr.dll','hostfxr.dll','hostpolicy.dll','System.Private.CoreLib.dll')
          $missing = @()
          foreach ($r in $required) {
            $found = $names | Where-Object { $_ -eq $r -or $_.EndsWith('/' + $r) }
            if (-not $found) { $missing += $r }
          }
          ("SCVERIFY msix_size=" + $msix.Length + " entries=" + $names.Count) >> ci-diagnostics.log
          Write-Host ("MSIX 大小: " + [math]::Round($msix.Length/1MB,1) + " MB, 条目数: " + $names.Count)
          if ($missing.Count -gt 0) {
            ("SCVERIFY missing=" + ($missing -join ',')) >> ci-diagnostics.log
            Write-Error ("MSIX 内缺失 .NET 运行时文件: " + ($missing -join ', ') + " —— SelfContained=true 未生效，请检查发布配置")
            exit 1
          }
          Write-Host "OK: .NET 运行时已随包自包含 (coreclr/hostfxr/hostpolicy/CoreLib 就位)"
          "CHECKPOINT:selfcontained-verify-done" >> ci-diagnostics.log

      # =====================================================================
      # P1-2 断言（阻断式，只读）：校验【包内实际生成的 AppxManifest.xml】。
      # 源码里的 Package.appxmanifest 干净 ≠ 构建产物干净：封进 .msix 的清单是
      # WASDK 构建目标在打包期【重新生成】的（会合并依赖、重写 Identity 等），
      # 而 SCGUARD / 版本断言 / 能力护栏读的全是仓库里那份源码清单 —— 真正生效的
      # 那一份此前无人读过。
      # 两条判据各自对应一种「CI 全绿、用户装不上」：
      #   ① <PackageDependency> 计数必须为 0：自包含模型下运行时已打进包，残留
      #      框架依赖会让离线安装时依赖校验失败（0x80073CF3）。源码清单早已不声明它
      #      （SCGUARD 注释里明示过），所以只可能由构建链在打包期重新注入 ——
      #      不读包内清单就永远发现不了。
      #   ② Identity Version 必须与源码 Package.appxmanifest 完全一致：不一致意味着
      #      升级/覆盖安装的判定基准被构建期改写（0x80073CFB 类问题）。
      #      期望值取自版本断言步写入 GITHUB_ENV 的 EXPECTED_MSIX_VERSION，
      #      不在此处写死，避免随每次发版漂移。
      # ⚠ 解包/读取失败一律显式报错：读不到 AppxManifest.xml 就断言无意义，
      #    静默通过等于又造一条恒绿断言（本项目已被这类断言坑过两轮）。
      # =====================================================================
      - name: Assert generated AppxManifest inside MSIX (blocking)
        shell: pwsh
        run: |
          "CHECKPOINT:gen-manifest-assert-start" >> ci-diagnostics.log
          $ErrorActionPreference = 'Stop'
          $expected = $env:EXPECTED_MSIX_VERSION
          if (-not $expected) { Write-Error "环境变量 EXPECTED_MSIX_VERSION 为空：版本断言步未写入（GITHUB_ENV 未生效？），无法校验包内清单版本，拒绝静默放行"; exit 1 }

          $msix = Get-ChildItem -Path "bin" -Recurse -Filter "*.msix" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { "GENMANIFEST=NO_MSIX" >> ci-diagnostics.log; Write-Error "未找到 .msix"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          # 条目数先取出来：Dispose 之后再访问 $zip.Entries 会抛异常，报错信息就没了。
          $entriesCount = $zip.Entries.Count
          $e = $zip.Entries | Where-Object { $_.Name -eq 'AppxManifest.xml' } | Select-Object -First 1
          if (-not $e) {
            $zip.Dispose()
            "GENMANIFEST=NO_MANIFEST_ENTRY" >> ci-diagnostics.log
            Write-Error ("MSIX 内未找到 AppxManifest.xml（包: " + $msix.Name + "，条目数: " + $entriesCount + "）：无法校验包内实际清单，断言不能静默通过")
            exit 1
          }
          $xml = $null
          try {
            $sr = New-Object System.IO.StreamReader($e.Open())
            $xml = $sr.ReadToEnd()
            $sr.Dispose()
          } catch {
            $zip.Dispose()
            "GENMANIFEST=READ_FAILED" >> ci-diagnostics.log
            Write-Error ("读取包内 AppxManifest.xml 失败: " + $_.Exception.Message)
            exit 1
          }
          $zip.Dispose()
          if (-not $xml -or $xml.Length -lt 32) { "GENMANIFEST=EMPTY" >> ci-diagnostics.log; Write-Error ("包内 AppxManifest.xml 内容异常（长度 " + $xml.Length + " 字节）：解包读取不可信，不能作为通过依据"); exit 1 }

          # 先剥 XML 注释再统计：SCGUARD 已在同一类问题上踩过 —— 注释里提到的
          # PackageDependency 不是真声明，不剥会把绿构建刷红。
          $xmlNoComment = [regex]::Replace($xml, '<!--[\s\S]*?-->', '')
          $dep = ([regex]::Matches($xmlNoComment, '<PackageDependency')).Count
          $ver = [regex]::Match($xmlNoComment, '<Identity\b[^>]*\bVersion="([^"]+)"').Groups[1].Value
          $pub = [regex]::Match($xmlNoComment, '<Identity\b[^>]*\bPublisher="([^"]+)"').Groups[1].Value
          ("GENMANIFEST dep=" + $dep + " version=" + $ver + " publisher=" + $pub + " expected_version=" + $expected) >> ci-diagnostics.log
          Write-Host ("GENMANIFEST dep=" + $dep + " version=" + $ver + " publisher=" + $pub + " expected=" + $expected)
          if ($dep -gt 0) { Write-Error ("包内生成的 AppxManifest.xml 仍含 <PackageDependency> x" + $dep + "：自包含模型下 WindowsAppSDK 运行时已打进包，再声明框架依赖会让离线安装时依赖校验失败（0x80073CF3）。源码 Package.appxmanifest 并无此声明，说明是构建链在打包期重新注入的。"); exit 1 }
          if (-not $ver) { Write-Error "包内 AppxManifest.xml 未取到 Identity Version：无法确认升级语义，拒绝静默放行"; exit 1 }
          if ($ver -ne $expected) { Write-Error ("包内 AppxManifest.xml 的 Version=" + $ver + " 与源码 Package.appxmanifest 的 " + $expected + " 不一致：构建期重写了版本号，覆盖安装/升级的判定基准被改（0x80073CFB 类问题）。请核对 Package.appxmanifest 与打包目标对 Identity 的处理。"); exit 1 }
          Write-Host "OK: 包内生成的 AppxManifest.xml 已校验（无框架依赖、版本与源码一致）"
          "CHECKPOINT:gen-manifest-assert-done" >> ci-diagnostics.log

      # =====================================================================

      # 仓库内 PhotoRenameAIHash.cer 与实际签名证书的漂移检测（非阻断）。

      # ⚠️ 本步必须排在 "Export signing certificate for artifact" 之前：那一步会用 pfx

      #    现场重导并【覆盖】PhotoRenameAIHash.cer，覆盖后就无从比对"仓库版"了。

      # 只告警不阻断：用户实际拿到的是 artifact 内的 cer（由下一步重写，永远与 pfx 一致），

      # 仓库版漂移影响的是"从仓库 clone 后直接跑 Install.bat"的那批人（0x800B0109）。

      # =====================================================================

      - name: Compare repo cer with signing cert (non-blocking)

        shell: pwsh

        env:

          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

        run: |



          "CHECKPOINT:certpin-start" >> ci-diagnostics.log



          $cerPath = Join-Path $env:GITHUB_WORKSPACE "PhotoRenameAIHash.cer"



          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "PhotoRenameAIHash.pfx"



          if (-not (Test-Path $cerPath)) {



            "CERTPIN=NO_REPO_CER" >> ci-diagnostics.log



            Write-Host "CERTPIN=NO_REPO_CER：仓库内没有 PhotoRenameAIHash.cer，跳过比对"



            "CHECKPOINT:certpin-done" >> ci-diagnostics.log



            exit 0



          }



          try {



            $repoCer = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $cerPath



            # 与 Verify / Export 两步保持一致：无密码读失败时回落带 PFX_PASSWORD 读。
            # 本步【非阻断】，读不到 pfx 只会落到外层 catch 打一条 warning —— 那等于
            # 「仓库 cer 漂移」这个护栏静默失明，而它唯一的发声渠道就是这里。
            $signCer = $null

            try { $signCer = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pfxPath } catch { $pinNoPwdErr = $_ }

            if ($signCer -and -not $signCer.Thumbprint) { $signCer = $null }

            if (-not $signCer) {

              if (-not $env:PFX_PASSWORD) { throw ("无密码读取 pfx 失败（" + $pinNoPwdErr.Exception.Message + "）且未配置 PFX_PASSWORD") }

              $sec = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force

              $signCer = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pfxPath, $sec

            }



            $match = ($repoCer.Thumbprint -eq $signCer.Thumbprint)



            $line = "CERTPIN match=" + $match + " repo=" + $repoCer.Thumbprint + " signer=" + $signCer.Thumbprint



            $line >> ci-diagnostics.log



            Write-Host $line



            if (-not $match) {



              Write-Host "::warning::仓库内的 PhotoRenameAIHash.cer（$($repoCer.Thumbprint)）与实际签名证书（$($signCer.Thumbprint)）不一致：以 artifact 中的 .cer 为准；从仓库 clone 后直接跑 Install.bat 会因证书不匹配报 0x800B0109。"



            }



          } catch {



            Write-Warning ("证书指纹比对失败: " + $_.Exception.Message)



          }



          "CHECKPOINT:certpin-done" >> ci-diagnostics.log



      # 产物级保险：用签名 pfx 重新导出 .cer 覆盖仓库版，保证 artifact 内的证书
      # 与实际签名证书永远一致（杜绝"仓库 cer 未同步 → 0x800B0109 不受信任"复发）。
      - name: Export signing certificate for artifact
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          "CHECKPOINT:cer-export-start" >> ci-diagnostics.log
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "PhotoRenameAIHash.pfx"
          # 同 Verify 步：无密码读失败时回落带 PFX_PASSWORD 读，避免换带密码 pfx 后
          # 本步以看不懂的 CryptographicException 报红（本步是阻断式，红了就没有 artifact cer）。
          $cert = $null
          try { $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pfxPath } catch { $noPwdErr = $_ }
          if ($cert -and -not $cert.Thumbprint) { $cert = $null }
          if (-not $cert -and $env:PFX_PASSWORD) {
            $sec = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pfxPath, $sec
          }
          if (-not $cert) { Write-Error ("无法从 pfx 读取签名证书（无密码读失败：" + $noPwdErr.Exception.Message + "；PFX_PASSWORD " + $(if ($env:PFX_PASSWORD) { "已配置但带密码读取仍失败" } else { "未配置" }) + "）"); exit 1 }
          $der = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE "PhotoRenameAIHash.cer"), $der)
          ("signer_thumbprint=" + $cert.Thumbprint) >> ci-diagnostics.log
          Write-Host ("artifact cer = signing cert " + $cert.Thumbprint)
          "CHECKPOINT:cer-export-done" >> ci-diagnostics.log

      # =====================================================================

      # A-15 产物 staging（阻断式）：把 msix + cer + Install.bat 扁平放到 artifact/ 同层。

      # 原实现直接给 upload-artifact 传多 pattern，而 v4 会取多 pattern 的「最近公共祖先」

      # 作为 artifact 根：patterns（**/AppPackages/**/*.msix + PhotoRenameAIHash.cer +

      # Install.bat）的公共祖先是仓库根 -> 下载解压后 .msix 落在深层

      # bin/.../AppPackages/.../ 下，而 Install.bat 在根目录用

      # `dir /b PhotoRenameAIHash*_x64.msix` 查找 -> 报 "msix not found"。

      # 扁平 staging 后三者同层，Install.bat 可正确找到包。

      # A-14：原名 "Package publish output as zip" 与实现不符（已不产 zip，只做存在性

      # 校验），且自报告仍打印 zip_exists=False 误导排障，故一并更名 + 改造。

      # =====================================================================

      - name: Stage release artifacts (msix + cer + Install.bat)

        shell: pwsh

        run: |

          "CHECKPOINT:stage-start" >> ci-diagnostics.log

          $ErrorActionPreference = 'Stop'

          $msix = Get-ChildItem -Path "bin" -Recurse -Filter "*.msix" | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $msix) { Write-Error "未找到 .msix（MSIX 发布失败，请检查上面的 Publish 日志）"; exit 1 }

          $stage = Join-Path $env:GITHUB_WORKSPACE "artifact"

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }

          New-Item -ItemType Directory -Path $stage | Out-Null

          Copy-Item $msix.FullName -Destination $stage -Force

          $cer = Join-Path $env:GITHUB_WORKSPACE "PhotoRenameAIHash.cer"

          $bat = Join-Path $env:GITHUB_WORKSPACE "Install.bat"

          if (-not (Test-Path $cer)) { Write-Error "缺少 PhotoRenameAIHash.cer（应已提交或被 Export signing certificate 步生成）"; exit 1 }

          if (-not (Test-Path $bat)) { Write-Error "缺少 Install.bat（应已提交到仓库根）"; exit 1 }

          Copy-Item $cer -Destination $stage -Force

          Copy-Item $bat -Destination $stage -Force

          $doc = Join-Path $env:GITHUB_WORKSPACE "安装说明.txt"

          if (-not (Test-Path $doc)) { Write-Error "缺少 安装说明.txt（应已提交到仓库根；它是随包说明，不参与安装）"; exit 1 }

          Copy-Item $doc -Destination $stage -Force

          # A-15 的延伸护栏（阻断式）：staging 只保证「三个文件同层」，从未保证 Install.bat
          # 真能【找到】那个包。Install.bat 第 46 行是用
          #   for /f "delims=" %%f in ('dir /b PhotoRenameAIHash*_x64.msix 2^>nul') do ...
          # 定位包的。若 MSIX 命名变了（平台段改叫 win-x64、被夹进 _Test 后缀等），
          # 三个文件照样同层、staging 照样绿，而用户双击 Install.bat 只会看到
          # 「本目录下未找到 PhotoRenameAIHash*_x64.msix」——典型的假绿灯：
          # CI 全绿、产物齐全、用户就是装不上。
          # 以下两级判据与 Install.bat 的两级查找一一对应：
          #   宽判据(阻断) 'PhotoRenameAIHash*.msix' —— Install.bat 的兜底查找模式。
          #     连它都不匹配 = 用户双击 Install.bat 必然报「未找到安装包」，必须拦下。
          #   窄判据(告警) 'PhotoRenameAIHash*_x64.msix' —— Install.bat 的首选查找模式。
          #     不匹配只说明命名漂移（如平台段改成 win-x64、或夹了 _Test 后缀），
          #     兜底查找仍能装上，所以只告警、不阻断；但它值得被看见：
          #     说明 Install.bat / 安装说明.txt / README 里的文件名约定已经过时了。
          $batWide  = 'PhotoRenameAIHash*.msix'
          $batNarrow = 'PhotoRenameAIHash*_x64.msix'

          if ($msix.Name -notlike $batWide) { Write-Error ("MSIX 文件名 '" + $msix.Name + "' 连 Install.bat 的兜底查找模式 '" + $batWide + "' 都不匹配：用户双击 Install.bat 必然报「未找到安装包」。请核对打包产物命名与 Install.bat 第 46 行起的 dir /b 通配。"); exit 1 }

          if ($msix.Name -notlike $batNarrow) { Write-Host ("::warning::MSIX 文件名 '" + $msix.Name + "' 不匹配 Install.bat 的首选模式 '" + $batNarrow + "'（已由兜底模式 '" + $batWide + "' 接住，用户仍可安装）：命名约定已漂移，请同步三处 —— Install.bat 的 dir /b 通配、README 的 Installing 章节（权威源）、安装说明.txt（随包精简版）。") }

          ("STAGE bat_wide_match=" + ($msix.Name -like $batWide) + " bat_narrow_match=" + ($msix.Name -like $batNarrow) + " name=" + $msix.Name) >> ci-diagnostics.log

          $files = @(Get-ChildItem $stage -File)

          foreach ($f in $files) { Write-Host ("  staged: " + $f.Name + " (" + $f.Length + " bytes)") }

          ("STAGE msix=" + $msix.Name + " size=" + $msix.Length + " files=" + $files.Count) >> ci-diagnostics.log

          Write-Host ("STAGE msix=" + $msix.Name + " size=" + $msix.Length + " files=" + $files.Count)

          "CHECKPOINT:stage-done" >> ci-diagnostics.log



      # 阻断式：staging 步已保证 artifact/ 内产物齐备（3 件必需 + 1 份随包说明，
      # 缺任一即已 exit 1），
      # 此时上传失败只剩网络/配额等瞬时因素。若继续 continue-on-error，
      # 会出现「CI 全绿但用户拿不到安装包」的静默失败——产物即交付物，宁可红灯。

      - name: Upload build artifact

        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4（固定 SHA）

        with:

          name: PhotoRenameAIHash-msix

          # A-15：改传已扁平 staging 的 artifact/ 单层目录。原多 pattern 写法会被

          # upload-artifact v4 按「最近公共祖先」重排目录树，导致 .msix 落到深层子目录

          # 而 Install.bat 在根 -> `dir /b PhotoRenameAIHash*_x64.msix` 找不到包。

          path: artifact/*

          if-no-files-found: error

          # 上一轮刚把本步改为阻断式（杜绝「CI 全绿但用户拿不到安装包」）。

          # 阻断式的必要配套就是限保留期：不限的话旧产物会吃满免费额度

          # （500MB / 2000 分钟；实测已累积 61 个产物约 3.55GB，单包 63MB），

          # 届时「配额不足」会让阻断式上传把 CI 变红，而根因根本不在代码里。

          # 限保留期是这个取舍的另一半；长期分发应走 GitHub Release（TODO）。
          #
          # 30 → 7：artifact 只是【中间交付物】（正式分发另有渠道），而本项目一轮
          # 迭代约 10 次提交 × 66.8MB/包，30 天稳态常驻轻易上 GB。撞配额时的表现
          # 是「代码没问题、上传步红灯」，且因为是阻断式还无法自愈 —— 非代码原因的
          # 红灯最贵，它会训练人忽略红灯。7 天足以覆盖交付窗口内的下载需求。

          retention-days: 7



      # === 自报告：无论成败，把诊断写回 ci-diag-report 分支（[skip ci] 不触发新跑；
      #     注：不用 ci-diag——该分支已在证书轮换时从仓库历史清除，不应复活），

      #     主理人用 contents:read 即可读取失败真相，绕开 Actions:Read 权限限制 ===

      - name: Self-report diagnostics to ci-diag-report branch

        if: always()

        # P1-5：本步末尾会 git push --force 到 ci-diag-report 分支，且带 if: always()
        # —— 无论构建成败都会执行。一旦 push 失败（并发运行互相覆盖 / 分支保护 / 网络抖动），
        # 会把一个本来全绿的构建刷成红灯。诊断留档不是交付物，它的失败只能警告，
        # 绝不能让「留档失败」掩盖掉真实的构建结论。
        continue-on-error: true

        shell: pwsh

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          $log = "ci-diagnostics.log"

          if (-not (Test-Path $log)) { "CHECKPOINT:none" | Out-File $log }

          "=== CI SELF-DIAGNOSTIC ===" | Out-File -Append $log

          ("run_id=" + $env:GITHUB_RUN_ID) | Out-File -Append $log

          ("sha=" + $env:GITHUB_SHA) | Out-File -Append $log

          $exes = Get-ChildItem -Path "bin" -Recurse -Filter "PhotoRenameAIHash.exe" -ErrorAction SilentlyContinue

          ("exe_count=" + $exes.Count) | Out-File -Append $log

          if ($exes.Count -gt 0) {

            $exe = $exes[0]

            $b = [System.IO.File]::ReadAllBytes($exe.FullName)

            $s = [System.Text.Encoding]::UTF8.GetString($b)

            ("exe_x64_count=" + [regex]::Matches($s,'processorArchitecture="x64"').Count) | Out-File -Append $log

            ("exe_amd64_count=" + [regex]::Matches($s,'processorArchitecture="amd64"').Count) | Out-File -Append $log

            ("exe_path=" + $exe.FullName) | Out-File -Append $log

          }

          # A-14：原此处打印 zip_exists（指向早已不产的 PhotoRenameAIHash-windows.zip），

          # 恒为 False，误导排障。改为报告实际产物 .msix 的存在性与大小。

          $msix = Get-ChildItem -Path "bin" -Recurse -Filter "*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1

          ("msix_found=" + [bool]$msix) | Out-File -Append $log

          if ($msix) {

            ("msix_name=" + $msix.Name) | Out-File -Append $log

            ("msix_bytes=" + $msix.Length) | Out-File -Append $log

          }

          if (Test-Path publish.out.log) {

            "--- publish.out.log (head 500) ---" | Out-File -Append $log

            (Get-Content publish.out.log | Select-Object -First 500) | Out-File -Append $log
            "--- publish.out.log (tail 300) ---" | Out-File -Append $log
            (Get-Content publish.out.log | Select-Object -Last 300) | Out-File -Append $log
            "--- publish.out.log (error grep) ---" | Out-File -Append $log
            (Get-Content publish.out.log | Select-String -Pattern 'error|APPX|MakeAppx|MakePri|SignAppxPackage|signtool|certificate|thumbprint|0x|C00C|invalid|Invalid|failed|Failed|not valid|duplicate|Duplicate|collision|Exception|warning') | Select-Object -First 120 | Out-File -Append $log

          }

          if (Test-Path publish.err.log) {

            "--- publish.err.log (tail 30) ---" | Out-File -Append $log

            (Get-Content publish.err.log -Tail 30) | Out-File -Append $log

          }

          git config user.email "ci@local"

          git config user.name "ci-bot"

          # 只推诊断日志本身，不推整棵工作树。
          # 旧实现推的是 HEAD 这个分支引用（origin HEAD:refs/heads/ci-diag-report），
          # 等于把触发分支的整棵源码树 + 整条历史复制过去：自报告提交的父提交直接
          # 就是触发分支的头，源码历史跟着每次 dump 一起堆。
          # orphan 分支无父提交，每次 force push 都把它替换成「一个提交 + 一个文件」。

          git switch --orphan ci-diag-tmp

          git add -f ci-diagnostics.log

          git commit -m "ci: diagnostic dump [skip ci]" | Out-Null

          git push --force origin ci-diag-tmp:refs/heads/ci-diag-report

          # 先把 push 的退出码存下来：本步没有显式 exit，步骤退出码由 $LASTEXITCODE
          # 决定（GH Actions 的 pwsh 模板会在脚本末尾 exit $LASTEXITCODE）。
          # 下面切回分支时会清一次 $LASTEXITCODE，若不先存，push 失败会被洗成绿勾 ——
          # 而本步还有 continue-on-error，连黄感叹号都不会有：诊断根本没留档却全绿。
          # 那正好抵消 bea1a52「诊断留档失败不得把绿构建刷红」的初衷：
          # 原设计是「失败可见但不红」，被洗成绿勾就变成「失败不可见」。

          $pushCode = $LASTEXITCODE

          Write-Host "pushed diagnostics to ci-diag branch"

          # 切回触发分支再收尾：否则 job 尾声的 Post Checkout（clean: true）会在
          # orphan 分支上做清理，语义变脏甚至留下噪声。
          # 注：$PSNativeCommandUseErrorActionPreference 默认为 $false（Learn 默认值表；
          # PowerShell-Docs #10752 据源码 InitialSessionState.cs 佐证），即当前默认下
          # git switch -f 失败并不会抛终止错误、下面那行兜底走得到。
          # 但 7.4 期间该默认值口径被来回改过，此处显式降级 + 清退出码是零成本保险。

          $back = $env:GITHUB_REF_NAME

          $ErrorActionPreference = 'Continue'

          if ($back) { git switch -f $back }

          if ($LASTEXITCODE -ne 0) { git checkout -f $env:GITHUB_SHA }

          $ErrorActionPreference = 'Stop'

          $LASTEXITCODE = 0

          exit $pushCode

