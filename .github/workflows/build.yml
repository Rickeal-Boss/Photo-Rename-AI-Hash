name: Build WinUI 3 (PhotoRenameAIHash)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, unpackaged, x64)
        # 官方唯一能稳定自带 _APP CRT 的路径：dotnet publish + WindowsAppSDKSelfContained=true
        # 根因：msbuild /t:Publish 不会把 VCRUNTIME140_APP / MSVCP140_APP / CONCRT140_APP
        #       复制进产物，而 WinAppSDK 原生 DLL 按 _APP 变体链接 VC++ CRT，
        #       缺失即报“应用程序的并行配置不正确”。
        # dotnet publish 的 .NET SDK 发布管线会正确调用 WinAppSDK 自包含逻辑，
        # 把 WinAppSDK 运行库与 _APP CRT 一并打进输出目录，实现真正免安装可移植。
        run: dotnet publish PhotoRenameAIHash.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 -p:WindowsAppSDKSelfContained=true

      - name: Show publish output path
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "bin" -Recurse -Filter "PhotoRenameAIHash.exe" | Select-Object -First 1
          if ($exe) { Write-Host "PUBLISH_EXE=$($exe.FullName)" } else { Write-Error "未找到发布的 exe" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRenameAIHash-windows
          path: bin/
          if-no-files-found: error
