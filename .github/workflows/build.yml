name: Build WinUI 3 (PhotoRenameAIHash)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild PhotoRenameAIHash.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Publish (self-contained, unpackaged, x64)
        # WinUI 3 必须用 Visual Studio 的 msbuild 发布（PRI 资源编译依赖 VS 的
        # AppxPackage 任务，裸 dotnet publish 会报 ExpandPriContent 任务加载失败）。
        # msbuild /t:Publish 能正确产出 WinAppSDK 运行库，但不会复制 _APP 后缀的
        # app-local CRT —— 由下一步补。
        run: msbuild PhotoRenameAIHash.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true

      # unpackaged 自包含发布缺的是 VCRUNTIME140_APP / MSVCP140_APP / CONCRT140_APP
      # （带 _APP 后缀的 app-local CRT，WinAppSDK 原生 DLL 按此变体链接，缺失即报
      # “并行配置不正确”）。WinAppSDK 的 SelfContained.targets 只从 MSIX 解压、并不含
      # _APP CRT；_APP CRT 由机器上安装的 Visual C++ 可再发行提供，位于 C:\Windows\System32。
      # windows-latest runner 已装 VC++ 可再发行，因此从此处复制 _APP 三件套到 exe 旁即可。
      # 绝不通配 System32 全目录（会卷进数百系统 DLL），只复制精确的 _APP 文件名。
      - name: Copy _APP CRT into publish output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path "bin" -Recurse -Filter "PhotoRenameAIHash.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "未找到发布的 exe"; exit 1 }
          $dest = $exe.DirectoryName
          Write-Host "发布输出目录: $dest"

          $appCrtNames = @("VCRUNTIME140_APP.dll", "MSVCP140_APP.dll", "CONCRT140_APP.dll")
          $searchRoots = @(
            "$env:WINDIR\System32",
            "$env:WINDIR\SysWOW64",
            "C:\Program Files (x86)\Windows Kits\10",
            "C:\Program Files\Microsoft Visual Studio",
            "C:\Program Files (x86)\Microsoft Visual Studio"
          )

          $copied = 0
          foreach ($name in $appCrtNames) {
            $src = $null
            foreach ($root in $searchRoots) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { $src = $hit.FullName; break }
            }
            if ($src) {
              Copy-Item $src -Destination $dest -Force
              Write-Host "已复制 $name <- $src"
              $copied++
            } else {
              Write-Warning "未找到 $name（目标机需自行安装 VC++ 可再发行 x64）"
            }
          }
          if ($copied -eq 0) { Write-Error "未在任何位置找到 _APP CRT，无法修复 SxS"; exit 1 }
          Write-Host "完成：已复制 $copied 个 _APP CRT 到 $dest"
          Get-ChildItem $dest -Filter "*_APP.dll" | ForEach-Object { Write-Host "  -> $($_.Name)" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRenameAIHash-windows
          path: bin/
          if-no-files-found: error
