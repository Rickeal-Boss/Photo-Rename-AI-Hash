name: Build WinUI 3 (PhotoRenameAIHash)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild PhotoRenameAIHash.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Publish (self-contained, unpackaged, x64)
        # WinUI 3 必须用 Visual Studio 的 msbuild 发布（PRI 资源编译依赖 VS 的
        # AppxPackage 任务，裸 dotnet publish 会报 ExpandPriContent 任务加载失败）。
        # msbuild /t:Publish 能正确产出 WinAppSDK 运行库，但不会复制 _APP 后缀的
        # app-local CRT —— 由下一步补。
        run: msbuild PhotoRenameAIHash.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true

      # unpackaged 自包含发布缺的是带 _APP 后缀的 app-local CRT
      # (VCRUNTIME140_APP / MSVCP140_APP / ...)。Microsoft.VCRTForwarders.140 包
      # 以"转发器"形式提供这些 DLL：把 WinAppSDK 原生 DLL 期望的 _APP 名称重定向到
      # 系统常规 vcruntime140.dll，从而根治"并行配置不正确"的 SxS 报错。
      # 为不依赖 NuGet 缓存路径、也不赌 msbuild 是否自动拷贝，本步直接从 nuget.org
      # 拉取该包(1.1.0)并解压 runtimes/win-x64/native/release/*.dll 到产物目录；
      # 仅当产物已存在同名文件时跳过。最后做硬性校验，确保 10 个 forwarder 全部就位。
      - name: Ensure _APP CRT forwarders + portable VC++ CRT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path "bin" -Recurse -Filter "PhotoRenameAIHash.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "未找到发布的 exe"; exit 1 }
          $dest = $exe.DirectoryName
          Write-Host "发布输出目录: $dest"

          $appDlls = @("vcruntime140_app.dll","msvcp140_app.dll","concrt140_app.dll",
                       "vcruntime140_1_app.dll","msvcp140_1_app.dll","msvcp140_2_app.dll",
                       "msvcp140_atomic_wait_app.dll","vccorlib140_app.dll","vcomp140_app.dll","vcamp140_app.dll")

          # 1) 直接自 nuget.org 拉取 Microsoft.VCRTForwarders.140 并解压 forwarders
          #    (不依赖本地缓存路径；Restore 阶段已证实 runner 可访问 api.nuget.org)
          $need = @()
          foreach ($dll in $appDlls) {
            if (-not (Test-Path (Join-Path $dest $dll))) { $need += $dll }
          }
          if ($need.Count -gt 0) {
            Write-Host "产物缺 $($need.Count) 个 forwarder，从 nuget.org 拉取 Microsoft.VCRTForwarders.140 ..."
            $ver = "1.1.0"
            $nupkg = Join-Path $env:RUNNER_TEMP ("vcrtforwarders." + $ver + ".nupkg")
            Invoke-WebRequest -Uri ("https://api.nuget.org/v3-flatcontainer/microsoft.vcrtforwarders.140/" + $ver + "/microsoft.vcrtforwarders.140." + $ver + ".nupkg") -OutFile $nupkg
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg)
            $rel = "runtimes/win-x64/native/release/"
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.StartsWith($rel, [System.StringComparison]::OrdinalIgnoreCase) -and $entry.FullName.EndsWith(".dll", [System.StringComparison]::OrdinalIgnoreCase)) {
                $name = [System.IO.Path]::GetFileName($entry.FullName)
                [System.IO.Compression.ZipFile]::ExtractToFile($entry, (Join-Path $dest $name), $true)
                Write-Host ("  提取 " + $name)
              }
            }
            $zip.Dispose()
          } else {
            Write-Host "OK: _APP CRT forwarders 已由 msbuild 自动就位，无需下载"
          }

          # 2) 硬性校验: 10 个 forwarder 必须全部存在
          $stillMissing = @()
          foreach ($dll in $appDlls) {
            if (-not (Test-Path (Join-Path $dest $dll))) { $stillMissing += $dll }
          }
          if ($stillMissing.Count -gt 0) { Write-Error ("仍缺失 _APP CRT forwarders: " + ($stillMissing -join ', ')); exit 1 }
          Write-Host "OK: 全部 _APP CRT forwarders 就位"

          # 3) 可移植增强(仅警告不致命): 把常规 VC++ CRT 一并拷入,
          #    使目标机未装 VC++ 可再发行时转发器也能找到 vcruntime140.dll。
          $sysCrt = @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","concrt140.dll")
          foreach ($dll in $sysCrt) {
            $sysPath = Join-Path $env:SystemRoot ("System32\" + $dll)
            if (Test-Path $sysPath) { Copy-Item $sysPath -Destination $dest -Force; Write-Host ("  便携 CRT: " + $dll) }
            else { Write-Warning ("System32 未找到 " + $dll + " (目标机需自装 VC++ 可再发行 x64)") }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRenameAIHash-windows
          path: bin/
          if-no-files-found: error
