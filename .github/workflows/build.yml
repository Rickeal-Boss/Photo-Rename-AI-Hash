name: Build WinUI 3 (PhotoRenameAIHash)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild PhotoRenameAIHash.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Publish (self-contained, unpackaged, x64)
        # WinUI 3 必须用 Visual Studio 的 msbuild 发布（PRI 资源编译依赖 VS 的
        # AppxPackage 任务，裸 dotnet publish 会报 ExpandPriContent 任务加载失败）。
        # msbuild /t:Publish 能正确产出 WinAppSDK 运行库，但不会复制 _APP 后缀的
        # app-local CRT —— 由下一步补。
        run: msbuild PhotoRenameAIHash.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true

      # unpackaged 自包含发布缺的是带 _APP 后缀的 app-local CRT
      # (VCRUNTIME140_APP / MSVCP140_APP / CONCRT140_APP)。这些由
      # Microsoft.VCRTForwarders.140 包(csproj 已引用)以"转发器"形式提供：
      # msbuild publish 会自动把 runtimes/win-x64/native/release/*.dll 拷进产物。
      # 转发器把 WinAppSDK 原生 DLL 期望的 _APP 名称重定向到系统常规 vcruntime140.dll，
      # 从而根治"并行配置不正确"的 SxS 报错。本步做兜底校验(从 NuGet 缓存补全)，
      # 并额外把常规 VC++ CRT 一并拷入，使制品在目标机未装 VC++ 可再发行时也能直接运行。
      - name: Ensure _APP CRT forwarders + portable VC++ CRT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path "bin" -Recurse -Filter "PhotoRenameAIHash.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "未找到发布的 exe"; exit 1 }
          $dest = $exe.DirectoryName
          Write-Host "发布输出目录: $dest"

          # 1) _APP 转发器: 优先确认 msbuild 已自动拷入; 缺失则从 NuGet 缓存补全
          $pkgRoot = "$env:USERPROFILE\.nuget\packages"
          $fwdPkg = Join-Path $pkgRoot "microsoft.vcrtforwarders.140"
          $fwdSrc = $null
          if (Test-Path $fwdPkg) {
            $fwdSrc = Get-ChildItem -Path $fwdPkg -Recurse -Directory -Filter "release" |
                      Where-Object { $_.FullName -like "*win-x64*native*release" } | Select-Object -First 1
          }
          $appDlls = @("vcruntime140_app.dll","msvcp140_app.dll","concrt140_app.dll",
                       "vcruntime140_1_app.dll","msvcp140_1_app.dll","msvcp140_2_app.dll",
                       "msvcp140_atomic_wait_app.dll","vccorlib140_app.dll","vcomp140_app.dll","vcamp140_app.dll")
          $missing = @()
          foreach ($dll in $appDlls) {
            if (-not (Test-Path (Join-Path $dest $dll))) {
              if ($fwdSrc) {
                $src = Join-Path $fwdSrc.FullName $dll
                if (Test-Path $src) { Copy-Item $src -Destination $dest -Force; Write-Host "  补全 $dll <- $src"; continue }
              }
              $missing += $dll
            }
          }
          if ($missing.Count -gt 0) { Write-Error "未找到 _APP CRT forwarders: $($missing -join ', ')"; exit 1 }
          Write-Host "OK: _APP CRT forwarders 就位"

          # 2) 可移植增强: 把常规 VC++ CRT 一并拷入(转发器最终依赖 vcruntime140.dll 等)
          #    目标机若无 VC++ 可再发行也能运行。仅警告, 不致命(多数 Windows 机已装)。
          $sysCrt = @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","concrt140.dll")
          foreach ($dll in $sysCrt) {
            $sysPath = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $sysPath) { Copy-Item $sysPath -Destination $dest -Force; Write-Host "  便携 CRT: $dll" }
            else { Write-Warning "System32 未找到 $dll (目标机需自装 VC++ 可再发行 x64)" }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRenameAIHash-windows
          path: bin/
          if-no-files-found: error
